<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TurboFix CRM" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>Customers — TurboFix CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/crm.css" />
</head>
<body>
<div id="toast-container"></div>
<div class="crm-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">T</div>
      <div><div class="logo-text">TurboFix</div><div class="logo-sub">CRM Dashboard</div></div>
    </div>
    <nav class="sidebar-nav" aria-label="Main navigation"><!-- built by renderSidebarNav() in js/auth.js --></nav>
    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="sidebar-user-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Admin</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menu-toggle"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg></button>
        <div><div class="header-title">Customers</div></div>
      </div>
    </header>

    <div class="page-content">
      <div class="toolbar">
        <div class="search-box">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803a7.5 7.5 0 0010.607 10.607z"/></svg>
          <input type="text" placeholder="Search by name, phone or email…" aria-label="Search customers" oninput="debounceSearch(this.value)" />
        </div>
      </div>

      <div class="table-wrapper">
        <table class="table-cards">
          <thead>
            <tr>
              <th>Customer</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Total Orders</th>
              <th>Member Since</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="customers-tbody">
            <tr><td colspan="6" style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div></td></tr>
          </tbody>
        </table>
      </div>
      <div id="customers-pagination" class="pagination" style="margin-top:16px;"></div>
    </div>
  </div>
</div>

<!-- Customer Detail Modal -->
<div class="modal-overlay" id="customer-modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title" id="cust-modal-title">Customer Details</div>
      <button class="modal-close" onclick="closeModal('customer-modal')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body" id="cust-modal-body">
      <div class="page-loader"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<script src="./js/config.js"></script>
<script src="./js/utils.js"></script>
<script src="./js/auth.js"></script>
<script>
  let currentUser = initCRM();
  let custPage = 1, custSearch = '';
  let searchTimer;

  async function loadCustomers() {
    const isStale = beginRequest('customers');
    const tbody = document.getElementById('customers-tbody');
    tbody.style.opacity = '0.6';
    const params = new URLSearchParams({ page: custPage, limit: 20, ...(custSearch && { search: custSearch }) });
    const r = await apiCall(`/customers?${params}`);
    if (isStale()) return;
    tbody.style.opacity = '';
    if (!r || !r.ok) {
      tbody.innerHTML = `<tr><td colspan="6">${loadErrorHTML(r, 'Failed to load customers', 'loadCustomers()')}</td></tr>`;
      document.getElementById('customers-pagination').innerHTML = '';
      return;
    }

    const { data, pagination } = r.data;
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><p>No customers found</p></div></td></tr>`;
      document.getElementById('customers-pagination').innerHTML = '';
      return;
    }

    tbody.innerHTML = data.map(c => `
      <tr>
        <td data-label="Customer">
          <div style="display:flex;align-items:center;gap:10px;">
            ${techAvatar(c.name, '#0066FF', 32)}
            <div>
              <div style="font-weight:600;color:var(--text);font-size:13px;">${esc(c.name)}</div>
            </div>
          </div>
        </td>
        <td data-label="Phone">
          ${c.phone ? `<a href="tel:${esc(c.phone)}" style="color:var(--text);font-size:13px;">${esc(c.phone)}</a> <a href="${waLink(c.phone)}" target="_blank" style="color:var(--success);font-size:12px;">WA</a>` : '—'}
        </td>
        <td data-label="Email" style="font-size:13px;">${esc(c.email||'—')}</td>
        <td data-label="Orders">
          <span style="font-weight:700;color:var(--text);">${c.total_orders}</span>
          <span style="color:var(--text-muted);font-size:11px;"> orders</span>
        </td>
        <td data-label="Since" style="font-size:12px;color:var(--text-muted);">${formatDate(c.created_at)}</td>
        <td class="td-actions">
          <button class="btn btn-secondary btn-sm" onclick="openCustomerModal(${c.id})">View Details</button>
        </td>
      </tr>
    `).join('');

    renderPagination('customers-pagination', pagination, 'goToPage');
  }

  function goToPage(p) { custPage = p; loadCustomers(); }
  function debounceSearch(val) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { custSearch = val; custPage = 1; loadCustomers(); }, 350);
  }

  async function openCustomerModal(id) {
    const isStale = beginRequest('customer-detail');
    openModal('customer-modal');
    const body = document.getElementById('cust-modal-body');
    document.getElementById('cust-modal-title').textContent = 'Customer Details';
    body.innerHTML = '<div class="page-loader"><div class="spinner"></div></div>';

    const r = await apiCall(`/customers/${id}`);
    if (isStale()) return;
    if (!r || !r.ok) { body.innerHTML = loadErrorHTML(r, 'Failed to load customer', `openCustomerModal(${Number(id)})`); return; }
    const c = r.data.data;
    document.getElementById('cust-modal-title').textContent = c.name;

    body.innerHTML = `
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:20px;">
        ${techAvatar(c.name, '#0066FF', 56)}
        <div>
          <div style="font-size:18px;font-weight:700;">${esc(c.name)}</div>
          <div style="font-size:13px;color:var(--text-muted);">Member since ${formatDate(c.created_at)}</div>
          <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;">
            ${c.phone ? `<a href="tel:${esc(c.phone)}" class="btn btn-secondary btn-sm">📞 Call</a>` : ''}
            <a href="${waLink(c.phone||'')}" target="_blank" class="btn btn-success btn-sm">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" style="width:14px;height:14px;"><path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z"/></svg>
              WhatsApp
            </a>
          </div>
        </div>
        <div style="margin-left:auto;text-align:right;">
          <div style="font-size:28px;font-weight:800;color:var(--text);">${c.total_orders}</div>
          <div style="font-size:12px;color:var(--text-muted);">Total Orders</div>
          ${'total_paid' in c ? `<div style="font-size:16px;font-weight:700;color:var(--success);margin-top:6px;">${formatCurrency(c.total_paid)}</div>
          <div style="font-size:11px;color:var(--text-muted);">Total Paid</div>` : ''}
        </div>
      </div>

      <div class="info-grid" style="margin-bottom:20px;">
        <div class="info-item"><div class="info-label">Phone</div><div class="info-value">${esc(c.phone||'—')}</div></div>
        <div class="info-item"><div class="info-label">Email</div><div class="info-value">${esc(c.email||'—')}</div></div>
        <div class="info-item" style="grid-column:1/-1;"><div class="info-label">Address</div><div class="info-value">${esc(c.address||'—')}</div></div>
      </div>

      <div class="card card-sm">
        <div class="card-title" style="font-size:13px;margin-bottom:12px;">Order History</div>
        ${c.orders && c.orders.length ? `
          <table style="font-size:12px;width:100%;border-collapse:collapse;">
            <thead><tr style="border-bottom:1px solid var(--border);">
              <th style="padding:8px 0;text-align:left;color:var(--text-muted);font-weight:600;">Order ID</th>
              <th style="padding:8px 0;text-align:left;color:var(--text-muted);font-weight:600;">Device</th>
              <th style="padding:8px 0;text-align:left;color:var(--text-muted);font-weight:600;">Status</th>
              ${currentUser.role !== 'telecaller' ? `<th style="padding:8px 0;text-align:left;color:var(--text-muted);font-weight:600;">Cost</th>` : ''}
              <th style="padding:8px 0;text-align:left;color:var(--text-muted);font-weight:600;">Date</th>
            </tr></thead>
            <tbody>${c.orders.map(o => `<tr style="border-bottom:1px solid var(--border);">
              <td style="padding:8px 0;"><a href="./orders.html?id=${o.order_id}" style="color:var(--accent);font-weight:600;">${o.order_id}</a></td>
              <td style="padding:8px 0;color:var(--text-dim);">${esc(o.device_brand)} ${esc(o.device_model)}</td>
              <td style="padding:8px 0;">${statusBadge(o.status)}</td>
              ${currentUser.role !== 'telecaller' ? `<td style="padding:8px 0;font-weight:600;color:var(--text);">${formatCurrency(o.actual_cost||o.estimated_cost)}</td>` : ''}
              <td style="padding:8px 0;color:var(--text-muted);">${formatDate(o.created_at)}</td>
            </tr>`).join('')}</tbody>
          </table>
        ` : '<p style="font-size:13px;color:var(--text-muted);">No orders yet</p>'}
      </div>
    `;
  }

  loadCustomers();
</script>
</body>
</html>
