<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TurboFix CRM" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>Dashboard — TurboFix CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/crm.css" />
  <style>
    .chart-bar-wrap { display: flex; align-items: flex-end; gap: 6px; height: 80px; }
    .chart-bar {
      flex: 1; min-width: 0; border-radius: 4px 4px 0 0;
      background: linear-gradient(180deg, var(--accent), var(--primary));
      min-height: 4px; position: relative; cursor: pointer;
    }
    .chart-bar:hover { opacity: 0.8; }
    .chart-bar[data-label]::after {
      content: attr(data-label);
      position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
      font-size: 9px; color: var(--text-muted); white-space: nowrap;
    }
    .chart-wrap { overflow: hidden; }
    .chart-bar-wrap { gap: 3px; }
    .chart-bar:first-child::after { left: 0; transform: none; }
    .status-donut { display: flex; align-items: center; gap: 24px; }
    .donut-legend { display: flex; flex-direction: column; gap: 8px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .tech-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .tech-row:last-child { border-bottom: none; }
    .tech-bar { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .tech-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 3px; }
    .recent-order-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .notif-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .notif-item:last-child { border-bottom: none; }
    .notif-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .notif-icon svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
<div id="toast-container"></div>

<div class="crm-layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">T</div>
      <div>
        <div class="logo-text">TurboFix</div>
        <div class="logo-sub">CRM Dashboard</div>
      </div>
    </div>

    <nav class="sidebar-nav" aria-label="Main navigation"><!-- built by renderSidebarNav() in js/auth.js --></nav>

    <div class="sidebar-bottom">
      <div class="sidebar-user" onclick="window.location='./index.html'">
        <div class="sidebar-user-avatar" id="sidebar-user-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Admin</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Super Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menu-toggle">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
        </button>
        <div>
          <div class="header-title">Dashboard</div>
          <div class="header-subtitle" id="header-date">—</div>
        </div>
      </div>
      <div class="header-right">
        <button class="btn btn-primary btn-sm" onclick="openAddOrderModal()">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          New Order
        </button>
      </div>
    </header>

    <div class="page-content">
      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card blue">
          <div class="stat-icon blue"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg></div>
          <div class="stat-value" id="stat-orders-today">—</div>
          <div class="stat-label">Orders Today</div>
        </div>
        <div class="stat-card green">
          <div class="stat-icon green"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 11-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 004.486-6.336l-3.276 3.277a3.004 3.004 0 01-2.25-2.25l3.276-3.276a4.5 4.5 0 00-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437l1.745-1.437m6.615 8.206L15.75 15.75M4.867 19.125h.008v.008h-.008v-.008z"/></svg></div>
          <div class="stat-value" id="stat-active-orders">—</div>
          <div class="stat-label">Active Orders</div>
        </div>
        <div class="stat-card amber">
          <div class="stat-icon amber"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z"/></svg></div>
          <div class="stat-value" id="stat-revenue">—</div>
          <div class="stat-label">Revenue This Month</div>
          <div class="stat-change" id="stat-revenue-change"></div>
        </div>
        <div class="stat-card blue">
          <div class="stat-icon blue"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/></svg></div>
          <div class="stat-value" id="stat-customers">—</div>
          <div class="stat-label">Total Customers</div>
        </div>
      </div>

      <!-- Charts row -->
      <div class="grid-2" style="margin-bottom:28px;">
        <!-- Revenue chart -->
        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-title">Revenue (30 days)</div>
            </div>
            <select class="form-control" style="width:auto;font-size:12px;padding:6px 28px 6px 10px;" aria-label="Revenue period" onchange="loadRevenueChart(this.value)">
              <option value="7d">7 days</option>
              <option value="30d" selected>30 days</option>
              <option value="90d">90 days</option>
            </select>
          </div>
          <div class="chart-wrap">
            <div class="chart-bar-wrap" id="revenue-chart" style="padding-bottom:20px;">
              <div class="page-loader"><div class="spinner"></div></div>
            </div>
          </div>
        </div>

        <!-- Orders by status -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">Orders by Status</div>
          </div>
          <div id="status-breakdown">
            <div class="page-loader"><div class="spinner"></div></div>
          </div>
        </div>
      </div>

      <!-- Bottom row -->
      <div class="grid-2">
        <!-- Recent orders -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">Recent Orders</div>
            <a href="./orders.html" class="btn btn-secondary btn-sm">View All</a>
          </div>
          <div id="recent-orders-list">
            <div class="page-loader"><div class="spinner"></div></div>
          </div>
        </div>

        <!-- Technician performance -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">Technician Performance</div>
          </div>
          <div id="tech-performance">
            <div class="page-loader"><div class="spinner"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Order modal -->
<div class="modal-overlay" id="add-order-modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title">Add Order</div>
      <button class="modal-close" onclick="closeModal('add-order-modal')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;">Customer</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Name *</label>
          <input type="text" class="form-control" id="ao-name" placeholder="Customer name" />
        </div>
        <div class="form-group">
          <label class="form-label">Phone *</label>
          <input type="text" class="form-control" id="ao-phone" placeholder="10-digit mobile number" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="ao-email" placeholder="Optional" />
        </div>
        <div class="form-group">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" id="ao-address" placeholder="Optional" />
        </div>
      </div>

      <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 10px;">Device</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Brand *</label>
          <select class="form-control" id="ao-brand" onchange="onAddOrderBrandChange()">
            <option value="">Select brand…</option>
          </select>
          <input type="text" class="form-control" id="ao-brand-other" placeholder="Enter brand name" style="margin-top:8px;display:none;" />
        </div>
        <div class="form-group">
          <label class="form-label">Model *</label>
          <select class="form-control" id="ao-model" style="display:none;" onchange="onAddOrderModelChange()"></select>
          <input type="text" class="form-control" id="ao-model-other" placeholder="Select a brand first" disabled />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Services & Quoted Cost per Issue *</label>
        <div id="ao-services" style="display:flex;flex-direction:column;gap:4px;font-size:13px;">
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Screen Replacement" onchange="recalcAddOrderCost()" /> Screen Replacement</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Battery Replacement" onchange="recalcAddOrderCost()" /> Battery Replacement</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Camera Module" onchange="recalcAddOrderCost()" /> Camera Module</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Water Damage" onchange="recalcAddOrderCost()" /> Water Damage</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Speaker / Mic" onchange="recalcAddOrderCost()" /> Speaker / Mic</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Charging Port" onchange="recalcAddOrderCost()" /> Charging Port</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Back Panel" onchange="recalcAddOrderCost()" /> Back Panel</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Software / Data" onchange="recalcAddOrderCost()" /> Software / Data</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:8px;">
          <input type="text" class="form-control" id="ao-service-other" placeholder="Other service (optional)" style="flex:1;" oninput="recalcAddOrderCost()" />
          <input type="number" class="form-control" id="ao-service-other-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Issue Description</label>
        <textarea class="form-control" id="ao-issue" rows="2" placeholder="Optional notes on the issue"></textarea>
      </div>

      <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 10px;">Order Details</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Service Type</label>
          <select class="form-control" id="ao-service-type">
            <option value="walk-in">Walk-in</option>
            <option value="pickup">Pickup</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Priority</label>
          <select class="form-control" id="ao-priority">
            <option value="normal">Normal</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Scheduled Date</label>
          <input type="date" class="form-control" id="ao-date" />
        </div>
        <div class="form-group">
          <label class="form-label">Scheduled Time</label>
          <input type="text" class="form-control" id="ao-time" placeholder="e.g. 10:00 AM – 12:00 PM" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Estimated Cost (₹) — total of the amounts entered above</label>
        <input type="number" class="form-control" id="ao-cost" placeholder="0.00" min="0" step="0.01" readonly style="background:var(--surface2);font-weight:700;" />
      </div>
      <div class="form-group">
        <label class="form-label">Customer Care</label>
        <select class="form-control" id="ao-cc"><option value="">Unassigned</option></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('add-order-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitAddOrder()">Create Order</button>
    </div>
  </div>
</div>

<script src="./js/config.js"></script>
<script src="./js/brands.js"></script>
<script src="./js/utils.js"></script>
<script src="./js/auth.js"></script>
<script>
  const currentUser = initCRM();

  // Header date
  document.getElementById('header-date').textContent =
    new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  // Load everything
  async function loadDashboard() {
    await Promise.all([loadStats(), loadRevenueChart('30d'), loadRecentOrders(), loadTechPerformance()]);
  }

  async function loadStats() {
    const r = await apiCall('/dashboard/stats');
    if (!r || !r.ok) {
      document.getElementById('status-breakdown').innerHTML = loadErrorHTML(r, 'Failed to load stats', 'loadStats()');
      return;
    }
    const d = r.data.data;

    document.getElementById('stat-orders-today').textContent  = d.orders_today;
    document.getElementById('stat-active-orders').textContent = d.active_orders;
    document.getElementById('stat-revenue').textContent       = formatCurrency(d.revenue_this_month);
    document.getElementById('stat-customers').textContent     = d.total_customers.toLocaleString();

    const changeEl = document.getElementById('stat-revenue-change');
    if (d.revenue_growth_pct !== null) {
      const up = parseFloat(d.revenue_growth_pct) >= 0;
      changeEl.className = `stat-change ${up ? 'up' : 'down'}`;
      changeEl.innerHTML = `${up ? '▲' : '▼'} ${Math.abs(d.revenue_growth_pct)}% vs last month`;
    }

    // Pending badge
    const pending = (d.orders_by_status || []).find(s => s.status === 'pending');
    const badge = document.getElementById('nav-pending-count');
    if (badge) {
      badge.textContent = pending && pending.count ? pending.count : '';
      badge.setAttribute('aria-label', `${pending ? pending.count : 0} pending orders`);
    }

    // Status breakdown
    renderStatusBreakdown(d.orders_by_status || []);
  }

  function renderStatusBreakdown(statuses) {
    const total = statuses.reduce((s, r) => s + r.count, 0) || 1;
    const colors = {
      pending:'#F59E0B', pickup_assigned:'#A78BFA', picked_up:'#60A5FA',
      under_diagnosis:'#FB923C', repairing:'#00AAFF', ready:'#10B981',
      delivered:'#34D399', cancelled:'#EF4444',
    };
    const el = document.getElementById('status-breakdown');
    el.innerHTML = statuses.map(s => `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <div style="width:8px;height:8px;border-radius:50%;background:${colors[s.status]||'#64748B'};flex-shrink:0;"></div>
        <div style="font-size:12px;color:var(--text-dim);flex:1;">${CRM.STATUS_LABELS[s.status]||s.status}</div>
        <div style="font-size:12px;font-weight:700;color:var(--text);">${s.count}</div>
        <div style="width:80px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;">
          <div style="width:${Math.round((s.count/total)*100)}%;height:100%;background:${colors[s.status]||'#64748B'};border-radius:3px;"></div>
        </div>
      </div>
    `).join('') || '<p style="color:var(--text-muted);font-size:13px;">No orders yet</p>';
  }

  async function loadRevenueChart(period) {
    const isStale = beginRequest('revenue-chart');
    const r = await apiCall(`/dashboard/revenue-chart?period=${period}`);
    if (isStale()) return;
    const el = document.getElementById('revenue-chart');
    if (!r || !r.ok) { el.innerHTML = loadErrorHTML(r, 'Failed to load revenue', `loadRevenueChart('${period}')`); return; }
    if (!r.data.data.length) {
      el.innerHTML = '<div class="empty-state" style="min-height:80px;padding:20px;"><p>No revenue data</p></div>';
      return;
    }
    const data = r.data.data;
    const max  = Math.max(...data.map(d => Number(d.revenue)), 1);
    const labelEvery = Math.max(1, Math.ceil(data.length / (window.innerWidth <= 600 ? 4 : 7)));

    el.innerHTML = data.map((d, i) => {
      const h   = Math.max(4, Math.round((d.revenue / max) * 76));
      const label = new Date(d.date).toLocaleDateString('en-IN', { day:'numeric', month:'short' });
      const showLabel = i % labelEvery === 0;
      return `<div class="chart-bar" style="height:${h}px;" ${showLabel ? `data-label="${label}"` : ''} title="₹${Number(d.revenue).toLocaleString('en-IN')} on ${label}"></div>`;
    }).join('');
  }

  async function loadRecentOrders() {
    const r = await apiCall('/dashboard/recent-orders?limit=8');
    const el = document.getElementById('recent-orders-list');
    if (!r || !r.ok) { el.innerHTML = loadErrorHTML(r, 'Failed to load recent orders', 'loadRecentOrders()'); return; }
    const orders = r.data.data;
    if (!orders.length) { el.innerHTML = '<div class="empty-state" style="padding:30px;"><p>No orders yet</p></div>'; return; }

    el.innerHTML = orders.map(o => `
      <div class="recent-order-row" onclick="window.location='./orders.html?id=${encodeURIComponent(o.order_id)}'">
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:600;color:var(--text);">${esc(o.order_id)}</div>
          <div style="font-size:11px;color:var(--text-muted);">${esc(o.customer_name)} · ${esc(o.device_brand)} ${esc(o.device_model)}</div>
        </div>
        ${statusBadge(o.status)}
        <div style="font-size:11px;color:var(--text-muted);">${timeAgo(o.created_at)}</div>
      </div>
    `).join('');
  }

  async function loadTechPerformance() {
    const r = await apiCall('/dashboard/technician-performance');
    const el = document.getElementById('tech-performance');
    if (!r || !r.ok) { el.innerHTML = loadErrorHTML(r, 'Failed to load technician stats', 'loadTechPerformance()'); return; }
    const techs = r.data.data;
    if (!techs.length) { el.innerHTML = '<div class="empty-state" style="padding:30px;"><p>No technicians</p></div>'; return; }

    const maxOrders = Math.max(...techs.map(t => t.total_orders), 1);
    el.innerHTML = techs.map(t => `
      <div class="tech-row">
        ${techAvatar(t.name, t.avatar_color, 32)}
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:600;color:var(--text);">${esc(t.name)}</div>
          <div class="tech-bar"><div class="tech-bar-fill" style="width:${Math.round((t.total_orders/maxOrders)*100)}%"></div></div>
        </div>
        <div style="text-align:right;font-size:12px;">
          <div style="font-weight:700;color:var(--text);">${t.completed}</div>
          <div style="color:var(--text-muted);">done</div>
        </div>
      </div>
    `).join('');
  }

  loadDashboard();

  // ── Add Order (opened directly from the Dashboard) ─────────────────────────
  (function populateAddOrderBrands() {
    const sel = document.getElementById('ao-brand');
    if (!sel) return;
    Object.keys(BRAND_MODELS).forEach(brand => {
      sel.insertAdjacentHTML('beforeend', `<option value="${esc(brand)}">${esc(brand)}</option>`);
    });
    sel.insertAdjacentHTML('beforeend', `<option value="Other">Other</option>`);
  })();

  function onAddOrderBrandChange() {
    const brand      = document.getElementById('ao-brand').value;
    const brandOther = document.getElementById('ao-brand-other');
    const modelSel    = document.getElementById('ao-model');
    const modelOther  = document.getElementById('ao-model-other');

    const models = BRAND_MODELS[brand] || [];
    brandOther.style.display = brand === 'Other' ? '' : 'none';

    if (models.length) {
      modelSel.innerHTML = `<option value="">Select model…</option>` +
        models.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('') +
        `<option value="__other__">Other / not listed</option>`;
      modelSel.style.display = '';
      modelOther.style.display = 'none';
      modelOther.disabled = true;
      modelOther.value = '';
    } else {
      modelSel.style.display = 'none';
      modelOther.style.display = '';
      modelOther.disabled = false;
      modelOther.placeholder = 'Enter model name';
    }
  }

  function onAddOrderModelChange() {
    const modelSel   = document.getElementById('ao-model');
    const modelOther = document.getElementById('ao-model-other');
    if (modelSel.value === '__other__') {
      modelOther.style.display = '';
      modelOther.disabled = false;
      modelOther.placeholder = 'Enter model name';
      modelOther.value = '';
    } else {
      modelOther.style.display = 'none';
      modelOther.disabled = true;
    }
  }

  function getAddOrderBrand() {
    const sel = document.getElementById('ao-brand').value;
    return sel === 'Other' ? document.getElementById('ao-brand-other').value.trim() : sel;
  }

  function getAddOrderModel() {
    const modelSel = document.getElementById('ao-model');
    if (modelSel.style.display !== 'none' && modelSel.value && modelSel.value !== '__other__') {
      return modelSel.value;
    }
    return document.getElementById('ao-model-other').value.trim();
  }

  // Shows/hides each service's cost input based on whether it's checked
  // (or, for "Other", whether text was typed), then sums everything visible
  // into the read-only Estimated Cost total — this is how you quote a
  // customer with two or more problems on one device.
  function recalcAddOrderCost() {
    let total = 0;
    document.querySelectorAll('#ao-services .service-row').forEach(row => {
      const cb = row.querySelector('input[type="checkbox"]');
      const costInput = row.querySelector('.service-cost');
      costInput.style.display = cb.checked ? '' : 'none';
      if (!cb.checked) costInput.value = '';
      else total += parseFloat(costInput.value) || 0;
    });

    const otherService = document.getElementById('ao-service-other').value.trim();
    const otherCost = document.getElementById('ao-service-other-cost');
    otherCost.style.display = otherService ? '' : 'none';
    if (!otherService) otherCost.value = '';
    else total += parseFloat(otherCost.value) || 0;

    document.getElementById('ao-cost').value = total ? total.toFixed(2) : '';
  }

  // [{ service, cost }] for every checked/typed service that has a cost entered.
  function getAddOrderServiceEstimates() {
    const estimates = [];
    document.querySelectorAll('#ao-services .service-row').forEach(row => {
      const cb = row.querySelector('input[type="checkbox"]');
      const cost = parseFloat(row.querySelector('.service-cost').value);
      if (cb.checked && Number.isFinite(cost) && cost >= 0) estimates.push({ service: cb.value, cost });
    });
    const otherService = document.getElementById('ao-service-other').value.trim();
    const otherCost = parseFloat(document.getElementById('ao-service-other-cost').value);
    if (otherService && Number.isFinite(otherCost) && otherCost >= 0) estimates.push({ service: otherService, cost: otherCost });
    return estimates;
  }

  let staffList = [];
  async function loadStaff() {
    if (staffList.length) return;
    const r = await apiCall('/staff?active=true');
    if (r && r.ok) staffList = r.data.data || [];
  }

  async function openAddOrderModal() {
    ['ao-name','ao-phone','ao-email','ao-address','ao-brand-other','ao-model-other','ao-service-other','ao-service-other-cost','ao-issue','ao-date','ao-time','ao-cost']
      .forEach(id => document.getElementById(id).value = '');
    await loadStaff();
    document.getElementById('ao-cc').innerHTML = '<option value="">Unassigned</option>' +
      staffList.map(s => `<option value="${s.id}">${esc(s.name)} (${s.role})</option>`).join('');
    document.getElementById('ao-brand').value = '';
    document.getElementById('ao-brand-other').style.display = 'none';
    document.getElementById('ao-model').style.display = 'none';
    document.getElementById('ao-model').innerHTML = '';
    document.getElementById('ao-model-other').style.display = '';
    document.getElementById('ao-model-other').disabled = true;
    document.getElementById('ao-model-other').placeholder = 'Select a brand first';
    document.getElementById('ao-service-type').value = 'walk-in';
    document.getElementById('ao-priority').value = 'normal';
    document.querySelectorAll('#ao-services input[type="checkbox"]').forEach(cb => cb.checked = false);
    document.querySelectorAll('#ao-services .service-cost').forEach(inp => { inp.value = ''; inp.style.display = 'none'; });
    document.getElementById('ao-service-other-cost').style.display = 'none';
    openModal('add-order-modal');
  }

  async function submitAddOrder() {
    const name    = document.getElementById('ao-name').value.trim();
    const phone   = document.getElementById('ao-phone').value.trim();
    const email   = document.getElementById('ao-email').value.trim();
    const address = document.getElementById('ao-address').value.trim();
    const brand   = getAddOrderBrand();
    const model   = getAddOrderModel();
    const issue   = document.getElementById('ao-issue').value.trim();
    const serviceType = document.getElementById('ao-service-type').value;
    const priority     = document.getElementById('ao-priority').value;
    const date    = document.getElementById('ao-date').value;
    const time    = document.getElementById('ao-time').value.trim();
    const cost    = document.getElementById('ao-cost').value;
    const cc      = document.getElementById('ao-cc').value;
    const otherService = document.getElementById('ao-service-other').value.trim();

    const services = Array.from(document.querySelectorAll('#ao-services input[type="checkbox"]:checked')).map(cb => cb.value);
    if (otherService) services.push(otherService);

    if (!name)  { showToast('Customer name is required', 'warn'); return; }
    if (!phone) { showToast('Customer phone is required', 'warn'); return; }
    if (!brand) { showToast('Device brand is required', 'warn'); return; }
    if (!model) { showToast('Device model is required', 'warn'); return; }
    if (!services.length) { showToast('Select at least one service', 'warn'); return; }

    const payload = {
      customer_name: name, customer_phone: phone,
      customer_email: email || undefined, customer_address: address || undefined,
      device_brand: brand, device_model: model,
      services, issue_description: issue || undefined,
      service_type: serviceType, pickup_address: address || undefined,
      scheduled_date: date || undefined, scheduled_time: time || undefined,
      priority, estimated_cost: cost || undefined,
      service_estimates: getAddOrderServiceEstimates(),
      customer_care_id: cc || undefined,
    };

    const r = await apiCall('/orders/manual', { method: 'POST', body: JSON.stringify(payload) });
    if (!r || !r.ok) { showToast(r?.data?.message || 'Failed to create order', 'error'); return; }

    showToast(`Order ${r.data.data.order_id} created`, 'success');
    closeModal('add-order-modal');
    loadRecentOrders();
    loadStats();
  }

</script>
</body>
</html>
