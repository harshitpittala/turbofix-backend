# ── TurboFix CRM — Netlify Configuration ─────────────────────────
# Deploy directory: turbofix-backend/crm
# Site: crm.turbofix.in

[build]
  publish = "."

# ── Proxy all /api/* calls to the Render backend ─────────────────
[[redirects]]
  from   = "/api/*"
  to     = "https://turbofix-backend-aqhy.onrender.com/api/:splat"
  status = 200
  force  = true

# ── SPA redirect (for future router support) ─────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Cache-Control          = "no-store, must-revalidate"
