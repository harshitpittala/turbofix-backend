# ── TurboFix CRM — Netlify Configuration ─────────────────────────
# Deploy directory: turbofix-backend/crm
# Site: crm.turbofix.in

[build]
  publish = "."

# ── Proxy all /api/* calls to the Render backend ─────────────────
[[redirects]]
  from   = "/api/*"
  to     = "https://turbofix-backend-aqhy.onrender.com/api/:splat"
  status = 200
  force  = true

# ── SPA redirect (for future router support) ─────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    # "no-cache" still revalidates every request (a cheap 304 when unchanged), so
    # deploys show up immediately — unlike "no-store", which re-downloaded all
    # CSS/JS on every page change and disabled instant back/forward navigation.
    Cache-Control          = "no-cache"
    # Installable-app features require HTTPS; tell browsers never to use plain HTTP.
    Strict-Transport-Security = "max-age=31536000"

# ── Installable app (PWA) ─────────────────────────────────────────
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# The service worker must always be re-checked so updates roll out on the
# next visit; scope is the site root because the file lives there.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type  = "text/javascript; charset=utf-8"
