<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — TurboFix CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/crm/css/crm.css" />
</head>
<body>
<div id="toast-container"></div>

<div class="crm-layout">
  <!-- Sidebar (same nav) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">T</div>
      <div><div class="logo-text">TurboFix</div><div class="logo-sub">CRM Dashboard</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-label">Main</div>
        <a href="/crm/index.html" class="nav-item">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
          Dashboard
        </a>
        <a href="/crm/orders.html" class="nav-item active">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/></svg>
          Orders
        </a>
      </div>
      <div class="nav-section">
        <div class="nav-label">Management</div>
        <a href="/crm/technicians.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/></svg>Technicians</a>
        <a href="/crm/customers.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Customers</a>
        <a href="/crm/payments.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z"/></svg>Payments</a>
      </div>
      <div class="nav-section">
        <a href="#" class="nav-item" onclick="logout();return false;"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>Sign Out</a>
      </div>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="sidebar-user-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Admin</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menu-toggle"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg></button>
        <div><div class="header-title">Repair Orders</div></div>
      </div>
      <div class="header-right">
        <button class="btn btn-secondary btn-sm" onclick="exportCSV()">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
          Export CSV
        </button>
      </div>
    </header>

    <div class="page-content">
      <!-- Filters -->
      <div class="toolbar">
        <div class="search-box">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803a7.5 7.5 0 0010.607 10.607z"/></svg>
          <input type="text" placeholder="Order ID, customer, phone…" oninput="debounceSearch(this.value)" id="search-input" />
        </div>
        <select class="form-control" style="width:160px;" onchange="applyFilter('status',this.value)">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="pickup_assigned">Pickup Assigned</option>
          <option value="picked_up">Picked Up</option>
          <option value="under_diagnosis">Under Diagnosis</option>
          <option value="repairing">Repairing</option>
          <option value="ready">Ready</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <select class="form-control" style="width:130px;" onchange="applyFilter('priority',this.value)">
          <option value="">All Priority</option>
          <option value="normal">Normal</option>
          <option value="high">High</option>
          <option value="urgent">Urgent</option>
        </select>
        <input type="date" class="form-control" style="width:160px;" onchange="applyFilter('date_from',this.value)" title="From date" />
        <input type="date" class="form-control" style="width:160px;" onchange="applyFilter('date_to',this.value)" title="To date" />
      </div>

      <!-- Table -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Device</th>
              <th>Service</th>
              <th>Status</th>
              <th>Priority</th>
              <th>Technician</th>
              <th>Est. Cost</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="orders-tbody">
            <tr><td colspan="10" style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div></td></tr>
          </tbody>
        </table>
      </div>
      <div id="orders-pagination" class="pagination" style="margin-top:16px;"></div>
    </div>
  </div>
</div>

<!-- Order detail modal -->
<div class="modal-overlay" id="order-modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-order-id">—</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px;" id="modal-order-date">—</div>
      </div>
      <button class="modal-close" onclick="closeModal('order-modal')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="page-loader"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<!-- Status update modal -->
<div class="modal-overlay" id="status-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Update Status</div>
      <button class="modal-close" onclick="closeModal('status-modal')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="status-order-id" />
      <div class="form-group">
        <label class="form-label">New Status</label>
        <select class="form-control" id="new-status-select"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Technician</label>
        <select class="form-control" id="tech-assign-select"><option value="">Unassigned</option></select>
      </div>
      <div class="form-group">
        <label class="form-label">Notes (optional)</label>
        <textarea class="form-control" id="status-notes" rows="2" placeholder="Add a note about this update…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('status-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitStatusUpdate()">Update Status</button>
    </div>
  </div>
</div>

<!-- Payment modal -->
<div class="modal-overlay" id="payment-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Record Payment</div>
      <button class="modal-close" onclick="closeModal('payment-modal')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="payment-order-id" />
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Amount (₹)</label>
          <input type="number" class="form-control" id="payment-amount" placeholder="0.00" min="0" step="0.01" />
        </div>
        <div class="form-group">
          <label class="form-label">Method</label>
          <select class="form-control" id="payment-method">
            <option value="cash">Cash</option>
            <option value="upi">UPI</option>
            <option value="card">Card</option>
            <option value="bank_transfer">Bank Transfer</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Transaction ID (optional)</label>
        <input type="text" class="form-control" id="payment-txn" placeholder="UTR / Reference number" />
      </div>
      <div class="form-group">
        <label class="form-label">Notes (optional)</label>
        <textarea class="form-control" id="payment-notes" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('payment-modal')">Cancel</button>
      <button class="btn btn-success" onclick="submitPayment()">Record Payment</button>
    </div>
  </div>
</div>

<script src="/crm/js/config.js"></script>
<script src="/crm/js/utils.js"></script>
<script src="/crm/js/auth.js"></script>
<script>
  let currentUser = initCRM();
  let state = { page:1, status:'', priority:'', date_from:'', date_to:'', search:'' };
  let allTechs = [];
  let searchTimer;

  // Check URL param for direct order open
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('id')) setTimeout(() => openOrderDetail(urlParams.get('id')), 400);

  async function loadOrders() {
    const tbody = document.getElementById('orders-tbody');
    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div></td></tr>`;

    const params = new URLSearchParams({
      page: state.page, limit: 20,
      ...(state.status    && { status: state.status }),
      ...(state.priority  && { priority: state.priority }),
      ...(state.date_from && { date_from: state.date_from }),
      ...(state.date_to   && { date_to: state.date_to }),
      ...(state.search    && { search: state.search }),
    });

    const r = await apiCall(`/orders?${params}`);
    if (!r || !r.ok) { tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;color:var(--danger);padding:30px;">Failed to load orders</td></tr>`; return; }

    const { data, pagination } = r.data;
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="10"><div class="empty-state"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/></svg><p>No orders found</p></div></td></tr>`;
      document.getElementById('orders-pagination').innerHTML = '';
      return;
    }

    tbody.innerHTML = data.map(o => `
      <tr>
        <td class="primary" style="cursor:pointer;" onclick="openOrderDetail('${o.order_id}')">
          ${esc(o.order_id)}
        </td>
        <td>
          <div style="font-weight:600;color:var(--text);font-size:13px;">${esc(o.customer_name||'—')}</div>
          <div style="font-size:11px;color:var(--text-muted);">${esc(o.customer_phone||'')}</div>
        </td>
        <td>
          <div style="font-size:13px;color:var(--text);">${esc(o.device_brand)}</div>
          <div style="font-size:11px;color:var(--text-muted);">${esc(o.device_model)}</div>
        </td>
        <td style="font-size:12px;">${esc(o.service_type==='pickup'?'Pickup':'Walk-in')}</td>
        <td>${statusBadge(o.status)}</td>
        <td>${priorityBadge(o.priority||'normal')}</td>
        <td>
          ${o.technician_name
            ? `<div style="display:flex;align-items:center;gap:6px;">${techAvatar(o.technician_name, o.avatar_color,24)}<span style="font-size:12px;">${esc(o.technician_name)}</span></div>`
            : `<span style="color:var(--text-muted);font-size:12px;">Unassigned</span>`}
        </td>
        <td style="font-size:13px;font-weight:600;color:var(--text);">${formatCurrency(o.estimated_cost)}</td>
        <td style="font-size:12px;color:var(--text-muted);">${formatDate(o.created_at)}</td>
        <td>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-secondary btn-sm" onclick="openOrderDetail('${o.order_id}')">View</button>
            <button class="btn btn-primary btn-sm" onclick="openStatusModal('${o.id}','${o.status}','${o.technician_id||''}')">Update</button>
          </div>
        </td>
      </tr>
    `).join('');

    renderPagination('orders-pagination', pagination, 'goToPage');
  }

  function goToPage(p) { state.page = p; loadOrders(); }
  function applyFilter(key, val) { state[key] = val; state.page = 1; loadOrders(); }
  function debounceSearch(val) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => applyFilter('search', val), 350);
  }

  async function openOrderDetail(orderId) {
    openModal('order-modal');
    document.getElementById('modal-order-id').textContent = orderId;
    document.getElementById('modal-body').innerHTML = '<div class="page-loader"><div class="spinner"></div></div>';

    const r = await apiCall(`/orders/${orderId}`);
    if (!r || !r.ok) {
      document.getElementById('modal-body').innerHTML = '<p style="color:var(--danger);text-align:center;padding:30px;">Failed to load order</p>';
      return;
    }
    const o = r.data.data;
    document.getElementById('modal-order-date').textContent = formatDateTime(o.created_at);

    const services = Array.isArray(o.services) ? o.services : JSON.parse(o.services || '[]');

    document.getElementById('modal-body').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;" class="modal-info-grid">
        <!-- Customer -->
        <div>
          <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;">Customer</div>
          <div class="info-grid">
            <div class="info-item"><div class="info-label">Name</div><div class="info-value">${esc(o.customer_name||'—')}</div></div>
            <div class="info-item"><div class="info-label">Phone</div><div class="info-value">
              <a href="${waLink(o.customer_phone||'','Hi, regarding your TurboFix repair order '+o.order_id)}" target="_blank" style="color:var(--success);">${esc(o.customer_phone||'—')}</a>
            </div></div>
            <div class="info-item"><div class="info-label">Email</div><div class="info-value">${esc(o.customer_email||'—')}</div></div>
            <div class="info-item"><div class="info-label">Address</div><div class="info-value">${esc(o.customer_address||'—')}</div></div>
          </div>
        </div>
        <!-- Device -->
        <div>
          <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;">Device & Order</div>
          <div class="info-grid">
            <div class="info-item"><div class="info-label">Brand</div><div class="info-value">${esc(o.device_brand)}</div></div>
            <div class="info-item"><div class="info-label">Model</div><div class="info-value">${esc(o.device_model)}</div></div>
            <div class="info-item"><div class="info-label">Services</div><div class="info-value">${services.join(', ')}</div></div>
            <div class="info-item"><div class="info-label">Status</div><div class="info-value">${statusBadge(o.status)}</div></div>
            <div class="info-item"><div class="info-label">Priority</div><div class="info-value">${priorityBadge(o.priority)}</div></div>
            <div class="info-item"><div class="info-label">Service Type</div><div class="info-value">${o.service_type}</div></div>
            ${o.scheduled_date ? `<div class="info-item"><div class="info-label">Scheduled</div><div class="info-value">${formatDate(o.scheduled_date)} ${o.scheduled_time||''}</div></div>` : ''}
            <div class="info-item"><div class="info-label">Est. Cost</div><div class="info-value">${formatCurrency(o.estimated_cost)}</div></div>
            <div class="info-item"><div class="info-label">Actual Cost</div><div class="info-value">${formatCurrency(o.actual_cost)}</div></div>
            <div class="info-item"><div class="info-label">Warranty</div><div class="info-value">${o.warranty_months} months</div></div>
          </div>
        </div>
      </div>

      ${o.issue_description ? `<div class="card card-sm" style="margin-bottom:16px;"><div class="card-title" style="font-size:13px;margin-bottom:6px;">Issue Description</div><p style="font-size:13px;color:var(--text-dim);">${esc(o.issue_description)}</p></div>` : ''}

      <!-- Technician -->
      <div class="card card-sm" style="margin-bottom:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div class="card-title" style="font-size:13px;">Technician</div>
          <button class="btn btn-secondary btn-sm" onclick="openStatusModal('${o.id}','${o.status}','${o.technician_id||''}')">Reassign</button>
        </div>
        ${o.technician_name
          ? `<div style="display:flex;align-items:center;gap:10px;margin-top:10px;">${techAvatar(o.technician_name, o.avatar_color, 36)}<div><div style="font-weight:600;">${esc(o.technician_name)}</div><div style="font-size:12px;color:var(--text-muted);">${esc(o.technician_specialty||'')}</div></div></div>`
          : `<p style="font-size:13px;color:var(--text-muted);margin-top:10px;">Unassigned</p>`}
      </div>

      <!-- Images -->
      ${o.images && o.images.length ? `
      <div class="card card-sm" style="margin-bottom:16px;">
        <div class="card-title" style="font-size:13px;margin-bottom:10px;">Images (${o.images.length})</div>
        <div class="image-grid">
          ${o.images.map(img => `<div class="image-thumb" onclick="window.open('${img.url}','_blank')"><img src="${img.url}" alt="repair image" loading="lazy" /></div>`).join('')}
        </div>
      </div>` : ''}

      <!-- Status timeline -->
      <div class="card card-sm" style="margin-bottom:16px;">
        <div class="card-title" style="font-size:13px;margin-bottom:14px;">Status History</div>
        <ul class="timeline">
          ${(o.history||[]).map((h,i,arr) => `
            <li class="timeline-item ${i===arr.length-1?'active':'done'}">
              <div class="timeline-status">${CRM.STATUS_LABELS[h.to_status]||h.to_status}</div>
              <div class="timeline-meta">${formatDateTime(h.created_at)} · ${esc(h.updated_by_name||'')}</div>
              ${h.notes ? `<div class="timeline-note">${esc(h.notes)}</div>` : ''}
            </li>`).join('')}
        </ul>
      </div>

      <!-- Payments -->
      <div class="card card-sm" style="margin-bottom:0;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <div class="card-title" style="font-size:13px;">Payments</div>
          <button class="btn btn-success btn-sm" onclick="openPaymentModal('${o.order_id}')">+ Record</button>
        </div>
        ${o.payments && o.payments.length ? `
          <table style="font-size:12px;width:100%;border-collapse:collapse;">
            <thead><tr style="border-bottom:1px solid var(--border);">
              <th style="padding:8px 0;text-align:left;color:var(--text-muted);font-weight:600;">Method</th>
              <th style="padding:8px 0;text-align:left;color:var(--text-muted);font-weight:600;">Amount</th>
              <th style="padding:8px 0;text-align:left;color:var(--text-muted);font-weight:600;">Status</th>
              <th style="padding:8px 0;text-align:left;color:var(--text-muted);font-weight:600;">Date</th>
            </tr></thead>
            <tbody>${o.payments.map(p => `<tr style="border-bottom:1px solid var(--border);">
              <td style="padding:8px 0;color:var(--text-dim);">${CRM.PAYMENT_METHODS[p.method]||p.method}</td>
              <td style="padding:8px 0;font-weight:700;color:var(--text);">${formatCurrency(p.amount)}</td>
              <td style="padding:8px 0;"><span class="badge" style="background:rgba(16,185,129,.15);color:var(--success);">${p.status}</span></td>
              <td style="padding:8px 0;color:var(--text-muted);">${formatDate(p.paid_at||p.created_at)}</td>
            </tr>`).join('')}</tbody>
          </table>
        ` : '<p style="font-size:13px;color:var(--text-muted);">No payments recorded</p>'}
      </div>

      <!-- Action buttons -->
      <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end;">
        <button class="btn btn-primary btn-sm" onclick="openStatusModal('${o.id}','${o.status}','${o.technician_id||''}')">
          Update Status
        </button>
      </div>
    `;

    // Responsive
    if (window.innerWidth < 600) {
      const grid = document.querySelector('.modal-info-grid');
      if (grid) grid.style.gridTemplateColumns = '1fr';
    }
  }

  async function loadTechs() {
    if (allTechs.length) return;
    const r = await apiCall('/technicians?active=true');
    if (r && r.ok) allTechs = r.data.data || [];
  }

  async function openStatusModal(dbId, currentStatus, currentTechId) {
    await loadTechs();
    document.getElementById('status-order-id').value = dbId;

    const allowed = CRM.STATUS_TRANSITIONS[currentStatus] || [];
    const statusSel = document.getElementById('new-status-select');
    statusSel.innerHTML = allowed.length
      ? allowed.map(s => `<option value="${s}">${CRM.STATUS_LABELS[s]}</option>`).join('')
      : `<option value="">No transitions available</option>`;

    const techSel = document.getElementById('tech-assign-select');
    techSel.innerHTML = `<option value="">Unassigned</option>` +
      allTechs.map(t => `<option value="${t.id}" ${t.id == currentTechId ? 'selected':''}>${esc(t.name)}</option>`).join('');

    document.getElementById('status-notes').value = '';
    openModal('status-modal');
  }

  async function submitStatusUpdate() {
    const orderId    = document.getElementById('status-order-id').value;
    const status     = document.getElementById('new-status-select').value;
    const techId     = document.getElementById('tech-assign-select').value;
    const notes      = document.getElementById('status-notes').value;

    if (!status) { showToast('Select a status', 'warn'); return; }

    const r = await apiCall(`/orders/${orderId}/status`, {
      method: 'PATCH',
      body: JSON.stringify({ status, notes, technician_id: techId || null }),
    });

    if (!r || !r.ok) { showToast(r?.data?.message || 'Update failed', 'error'); return; }
    showToast('Status updated successfully', 'success');
    closeModal('status-modal');
    closeModal('order-modal');
    loadOrders();
  }

  function openPaymentModal(orderId) {
    document.getElementById('payment-order-id').value = orderId;
    document.getElementById('payment-amount').value   = '';
    document.getElementById('payment-txn').value      = '';
    document.getElementById('payment-notes').value    = '';
    openModal('payment-modal');
  }

  async function submitPayment() {
    const orderId = document.getElementById('payment-order-id').value;
    const amount  = document.getElementById('payment-amount').value;
    const method  = document.getElementById('payment-method').value;
    const txn     = document.getElementById('payment-txn').value;
    const notes   = document.getElementById('payment-notes').value;

    if (!amount || parseFloat(amount) <= 0) { showToast('Enter valid amount', 'warn'); return; }

    const r = await apiCall('/payments', {
      method: 'POST',
      body: JSON.stringify({ order_id: orderId, amount: parseFloat(amount), method, transaction_id: txn, notes }),
    });

    if (!r || !r.ok) { showToast(r?.data?.message || 'Payment failed', 'error'); return; }
    showToast('Payment recorded', 'success');
    closeModal('payment-modal');
    loadOrders();
  }

  function exportCSV() {
    const params = new URLSearchParams({
      ...(state.status    && { status: state.status }),
      ...(state.date_from && { date_from: state.date_from }),
      ...(state.date_to   && { date_to: state.date_to }),
    });
    const token = localStorage.getItem('crm_token');
    window.open(`${CRM.API_BASE}/orders/export?${params}`, '_blank');
  }

  // Close modal on backdrop click
  document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', (e) => { if (e.target === el) el.classList.remove('open'); });
  });

  loadOrders();
</script>
</body>
</html>
