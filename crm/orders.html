<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TurboFix CRM" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>Orders — TurboFix CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/crm.css" />
</head>
<body>
<div id="toast-container"></div>

<div class="crm-layout">
  <!-- Sidebar (same nav) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">T</div>
      <div><div class="logo-text">TurboFix</div><div class="logo-sub">CRM Dashboard</div></div>
    </div>
    <nav class="sidebar-nav" aria-label="Main navigation"><!-- built by renderSidebarNav() in js/auth.js --></nav>
    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="sidebar-user-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Admin</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menu-toggle"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg></button>
        <div><div class="header-title">Repair Orders</div></div>
      </div>
      <div class="header-right">
        <button class="btn btn-primary btn-sm" onclick="openAddOrderModal()">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          Add Order
        </button>
        <button class="btn btn-secondary btn-sm" onclick="exportCSV()" data-owner-only>
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
          Export CSV
        </button>
      </div>
    </header>

    <div class="page-content">
      <!-- Filters -->
      <div class="toolbar">
        <div class="search-box">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803a7.5 7.5 0 0010.607 10.607z"/></svg>
          <input type="text" placeholder="Order ID, customer, phone…" aria-label="Search orders" oninput="debounceSearch(this.value)" id="search-input" />
        </div>
        <select class="form-control" style="width:160px;" aria-label="Filter by status" onchange="applyFilter('status',this.value)">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="pickup_assigned">Pickup Assigned</option>
          <option value="picked_up">Picked Up</option>
          <option value="under_diagnosis">Under Diagnosis</option>
          <option value="repairing">Repairing</option>
          <option value="ready">Ready</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <select class="form-control" style="width:130px;" aria-label="Filter by priority" onchange="applyFilter('priority',this.value)">
          <option value="">All Priority</option>
          <option value="normal">Normal</option>
          <option value="high">High</option>
          <option value="urgent">Urgent</option>
        </select>
        <input type="date" class="form-control" style="width:160px;" onchange="applyFilter('date_from',this.value)" title="From date" aria-label="From date" />
        <input type="date" class="form-control" style="width:160px;" onchange="applyFilter('date_to',this.value)" title="To date" aria-label="To date" />
      </div>

      <!-- Table -->
      <div class="table-wrapper">
        <table class="table-cards">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Device</th>
              <th>Status</th>
              <th>Technician</th>
              <th>Customer Care</th>
              <th>Est. Cost</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="orders-tbody">
            <tr><td colspan="9" style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div></td></tr>
          </tbody>
        </table>
      </div>
      <div id="orders-pagination" class="pagination" style="margin-top:16px;"></div>
    </div>
  </div>
</div>

<!-- Order detail modal -->
<div class="modal-overlay" id="order-modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-order-id">—</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px;" id="modal-order-date">—</div>
      </div>
      <button class="modal-close" onclick="closeModal('order-modal')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="page-loader"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<!-- Status update modal -->
<div class="modal-overlay" id="status-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Update Status</div>
      <button class="modal-close" onclick="closeModal('status-modal')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="status-order-id" />
      <div class="form-group">
        <label class="form-label">New Status</label>
        <select class="form-control" id="new-status-select"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Technician</label>
        <select class="form-control" id="tech-assign-select"><option value="">Unassigned</option></select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">IMEI Number</label>
          <input type="text" class="form-control" id="status-imei" placeholder="15-digit IMEI (optional)" maxlength="20" />
        </div>
        <div class="form-group">
          <label class="form-label">Warranty</label>
          <select class="form-control" id="status-warranty">
            <option value="3">3 Months</option>
            <option value="6">6 Months</option>
            <option value="12">1 Year</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notes (optional)</label>
        <textarea class="form-control" id="status-notes" rows="2" placeholder="Add a note about this update…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('status-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitStatusUpdate()">Update Status</button>
    </div>
  </div>
</div>

<!-- Payment modal -->
<div class="modal-overlay" id="payment-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Record Payment</div>
      <button class="modal-close" onclick="closeModal('payment-modal')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="payment-order-id" />
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Amount (₹)</label>
          <input type="number" class="form-control" id="payment-amount" placeholder="0.00" min="0" step="0.01" />
        </div>
        <div class="form-group">
          <label class="form-label">Method</label>
          <select class="form-control" id="payment-method">
            <option value="cash">Cash</option>
            <option value="upi">UPI</option>
            <option value="card">Card</option>
            <option value="bank_transfer">Bank Transfer</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Transaction ID (optional)</label>
        <input type="text" class="form-control" id="payment-txn" placeholder="UTR / Reference number" />
      </div>
      <div class="form-group">
        <label class="form-label">Notes (optional)</label>
        <textarea class="form-control" id="payment-notes" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('payment-modal')">Cancel</button>
      <button class="btn btn-success" onclick="submitPayment()">Record Payment</button>
    </div>
  </div>
</div>

<!-- Add Order modal -->
<div class="modal-overlay" id="add-order-modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title">Add Order</div>
      <button class="modal-close" onclick="closeModal('add-order-modal')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;">Customer</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Name *</label>
          <input type="text" class="form-control" id="ao-name" placeholder="Customer name" />
        </div>
        <div class="form-group">
          <label class="form-label">Phone *</label>
          <input type="text" class="form-control" id="ao-phone" placeholder="10-digit mobile number" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="ao-email" placeholder="Optional" />
        </div>
        <div class="form-group">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" id="ao-address" placeholder="Optional" />
        </div>
      </div>

      <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 10px;">Device</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Brand *</label>
          <select class="form-control" id="ao-brand" onchange="onAddOrderBrandChange()">
            <option value="">Select brand…</option>
          </select>
          <input type="text" class="form-control" id="ao-brand-other" placeholder="Enter brand name" style="margin-top:8px;display:none;" />
        </div>
        <div class="form-group">
          <label class="form-label">Model *</label>
          <select class="form-control" id="ao-model" style="display:none;" onchange="onAddOrderModelChange()"></select>
          <input type="text" class="form-control" id="ao-model-other" placeholder="Select a brand first" disabled />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Services & Quoted Cost per Issue *</label>
        <div id="ao-services" style="display:flex;flex-direction:column;gap:4px;font-size:13px;">
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Screen Replacement" onchange="recalcAddOrderCost()" /> Screen Replacement</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Battery Replacement" onchange="recalcAddOrderCost()" /> Battery Replacement</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Camera Module" onchange="recalcAddOrderCost()" /> Camera Module</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Water Damage" onchange="recalcAddOrderCost()" /> Water Damage</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Speaker / Mic" onchange="recalcAddOrderCost()" /> Speaker / Mic</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Charging Port" onchange="recalcAddOrderCost()" /> Charging Port</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Back Panel" onchange="recalcAddOrderCost()" /> Back Panel</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
          <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="Software / Data" onchange="recalcAddOrderCost()" /> Software / Data</label>
            <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:8px;">
          <input type="text" class="form-control" id="ao-service-other" placeholder="Other service (optional)" style="flex:1;" oninput="recalcAddOrderCost()" />
          <input type="number" class="form-control" id="ao-service-other-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcAddOrderCost()" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Issue Description</label>
        <textarea class="form-control" id="ao-issue" rows="2" placeholder="Optional notes on the issue"></textarea>
      </div>

      <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 10px;">Order Details</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Service Type</label>
          <select class="form-control" id="ao-service-type">
            <option value="walk-in">Walk-in</option>
            <option value="pickup">Pickup</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Priority</label>
          <select class="form-control" id="ao-priority">
            <option value="normal">Normal</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Scheduled Date</label>
          <input type="date" class="form-control" id="ao-date" />
        </div>
        <div class="form-group">
          <label class="form-label">Scheduled Time</label>
          <input type="text" class="form-control" id="ao-time" placeholder="e.g. 10:00 AM – 12:00 PM" />
        </div>
      </div>
      <div class="form-group" id="ao-cost-group">
        <label class="form-label">Estimated Cost (₹) — total of the amounts entered above</label>
        <input type="number" class="form-control" id="ao-cost" placeholder="0.00" min="0" step="0.01" readonly style="background:var(--surface2);font-weight:700;" />
      </div>
      <div class="form-group">
        <label class="form-label">Customer Care</label>
        <select class="form-control" id="ao-cc"><option value="">Unassigned</option></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('add-order-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitAddOrder()">Create Order</button>
    </div>
  </div>
</div>

<script src="./js/config.js"></script>
<script src="./js/brands.js"></script>
<script src="./js/utils.js"></script>
<script src="./js/auth.js"></script>
<script>
  let currentUser = initCRM();
  let state = { page:1, status:'', priority:'', date_from:'', date_to:'', search:'' };
  let allTechs = [];
  let staffList = [];
  let searchTimer;
  let ordersCache = {};       // id -> row data, refreshed on every list load
  let currentOrderDetail = null;

  // Check URL param for direct order open
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('id')) setTimeout(() => openOrderDetail(urlParams.get('id')), 400);
  let pendingLeadId = urlParams.get('lead') || null;
  if (pendingLeadId) setTimeout(() => openAddOrderModal(), 400);

  async function loadOrders() {
    const isStale = beginRequest('orders');
    const tbody = document.getElementById('orders-tbody');
    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div></td></tr>`;

    const params = new URLSearchParams({
      page: state.page, limit: 20,
      ...(state.status    && { status: state.status }),
      ...(state.priority  && { priority: state.priority }),
      ...(state.date_from && { date_from: state.date_from }),
      ...(state.date_to   && { date_to: state.date_to }),
      ...(state.search    && { search: state.search }),
    });

    const r = await apiCall(`/orders?${params}`);
    if (isStale()) return;
    if (!r || !r.ok) {
      tbody.innerHTML = `<tr><td colspan="9">${loadErrorHTML(r, 'Failed to load orders', 'loadOrders()')}</td></tr>`;
      document.getElementById('orders-pagination').innerHTML = '';
      return;
    }

    const { data, pagination } = r.data;
    ordersCache = {};
    data.forEach(o => { ordersCache[o.id] = o; });

    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/></svg><p>No orders found</p></div></td></tr>`;
      document.getElementById('orders-pagination').innerHTML = '';
      return;
    }

    tbody.innerHTML = data.map(o => `
      <tr>
        <td class="primary" data-label="Order" style="cursor:pointer;" onclick="openOrderDetail('${o.order_id}')">
          ${esc(o.order_id)}
        </td>
        <td data-label="Customer">
          <div style="font-weight:600;color:var(--text);font-size:13px;">${esc(o.customer_name||'—')}</div>
          <div style="font-size:11px;color:var(--text-muted);">${esc(o.customer_phone||'')}</div>
        </td>
        <td data-label="Device">
          <div style="font-size:13px;color:var(--text);">${esc(o.device_brand)}</div>
          <div style="font-size:11px;color:var(--text-muted);">${esc(o.device_model)}</div>
        </td>
        <td data-label="Status">${statusBadge(o.status)}</td>
        <td data-label="Technician">
          ${o.technician_name
            ? `<div style="display:flex;align-items:center;gap:6px;">${techAvatar(o.technician_name, o.avatar_color,24)}<span style="font-size:12px;">${esc(o.technician_name)}</span></div>`
            : `<span style="color:var(--text-muted);font-size:12px;">Unassigned</span>`}
        </td>
        <td data-label="Customer Care" style="font-size:12px;${o.customer_care_name ? 'color:var(--accent);font-weight:600;' : 'color:var(--text-muted);'}">${esc(o.customer_care_name||'Unassigned')}</td>
        <td data-label="Est. Cost" style="font-size:13px;font-weight:600;color:var(--text);">${formatCurrency(o.estimated_cost)}</td>
        <td data-label="Date" style="font-size:12px;color:var(--text-muted);">${formatDate(o.created_at)}</td>
        <td class="td-actions">
          <div style="display:flex;gap:6px;">
            <button class="btn btn-secondary btn-sm" onclick="openOrderDetail('${o.order_id}')">View</button>
            <button class="btn btn-primary btn-sm" onclick="openStatusModal('${o.id}')">Update</button>
          </div>
        </td>
      </tr>
    `).join('');

    renderPagination('orders-pagination', pagination, 'goToPage');
  }

      .join('');

  async function submitPayment() {
    const orderId = document.getElementById('payment-order-id').value;
    const amount  = document.getElementById('payment-amount').value;
    const method  = document.getElementById('payment-method').value;
    const txn     = document.getElementById('payment-txn').value;
    const notes   = document.getElementById('payment-notes').value;

    if (!amount || parseFloat(amount) <= 0) { showToast('Enter valid amount', 'warn'); return; }

    const r = await apiCall('/payments', {
      method: 'POST',
      body: JSON.stringify({ order_id: orderId, amount: parseFloat(amount), method, transaction_id: txn, notes }),
    });

    if (!r || !r.ok) { showToast(r?.data?.message || 'Payment failed', 'error'); return; }
    showToast('Payment recorded', 'success');
    closeModal('payment-modal');
    loadOrders();
    refreshOpenOrderDetail();
  }

  async function deletePayment(paymentId, amountLabel) {
    if (!confirm(`Delete this ${amountLabel} payment record? It will be removed from revenue. This cannot be undone.`)) return;
    const r = await apiCall(`/payments/${paymentId}`, { method: 'DELETE' });
    if (!r || !r.ok) { showToast(r?.data?.message || 'Failed to delete payment', 'error'); return; }
    showToast('Payment deleted', 'success');
    loadOrders();
    refreshOpenOrderDetail();
  }

  // Shows/hides each service's cost input based on whether it's checked
  // (or, for "Other", whether text was typed), then sums everything visible
  // into the read-only Estimated Cost total — this is how a telecaller quotes
  // a customer with two or more problems on one device.
  function recalcAddOrderCost() {
    let total = 0;
    document.querySelectorAll('#ao-services .service-row').forEach(row => {
      const cb = row.querySelector('input[type="checkbox"]');
      const costInput = row.querySelector('.service-cost');
      costInput.style.display = cb.checked ? '' : 'none';
      if (!cb.checked) costInput.value = '';
      else total += parseFloat(costInput.value) || 0;
    });

    const otherService = document.getElementById('ao-service-other').value.trim();
    const otherCost = document.getElementById('ao-service-other-cost');
    otherCost.style.display = otherService ? '' : 'none';
    if (!otherService) otherCost.value = '';
    else total += parseFloat(otherCost.value) || 0;

    document.getElementById('ao-cost').value = total ? total.toFixed(2) : '';
  }

  // [{ service, cost }] for every checked/typed service that has a cost entered.
  function getAddOrderServiceEstimates() {
    const estimates = [];
    document.querySelectorAll('#ao-services .service-row').forEach(row => {
      const cb = row.querySelector('input[type="checkbox"]');
      const cost = parseFloat(row.querySelector('.service-cost').value);
      if (cb.checked && Number.isFinite(cost) && cost >= 0) estimates.push({ service: cb.value, cost });
    });
    const otherService = document.getElementById('ao-service-other').value.trim();
    const otherCost = parseFloat(document.getElementById('ao-service-other-cost').value);
    if (otherService && Number.isFinite(otherCost) && otherCost >= 0) estimates.push({ service: otherService, cost: otherCost });
    return estimates;
  }

    ['ao-name','ao-phone','ao-email','ao-address','ao-brand-other','ao-model-other','ao-service-other','ao-service-other-cost','ao-issue','ao-date','ao-time','ao-cost']
      .forEach(id => document.getElementById(id).value = '');
    await loadStaff();
    const ccSel = document.getElementById('ao-cc');
    ccSel.innerHTML = '<option value="">Unassigned</option>' +
      staffList.map(s => `<option value="${s.id}" ${currentUser.role === 'telecaller' && s.id == currentUser.id ? 'selected' : ''}>${esc(s.name)} (${s.role})</option>`).join('');
    document.getElementById('ao-brand').value = '';
    document.getElementById('ao-brand-other').style.display = 'none';
    document.getElementById('ao-model').style.display = 'none';
    document.getElementById('ao-model').innerHTML = '';
    document.getElementById('ao-model-other').style.display = '';
    document.getElementById('ao-model-other').disabled = true;
    document.getElementById('ao-model-other').placeholder = 'Select a brand first';
    document.getElementById('ao-service-type').value = 'walk-in';
    document.getElementById('ao-priority').value = 'normal';
    document.querySelectorAll('#ao-services input[type="checkbox"]').forEach(cb => cb.checked = false);
    document.querySelectorAll('#ao-services .service-cost').forEach(inp => { inp.value = ''; inp.style.display = 'none'; });
    document.getElementById('ao-service-other-cost').style.display = 'none';

    // Arriving from a converted lead (Schedules → "Create Order")? Pre-fill
    // what the telecaller already captured so nothing has to be retyped.
    if (pendingLeadId) {
      const r = await apiCall(`/activities/${pendingLeadId}`);
      if (r && r.ok) {
        const lead = r.data.data;
        document.getElementById('ao-name').value = lead.customer_name || '';
        document.getElementById('ao-phone').value = lead.customer_phone || '';
        if (lead.device_brand) {
          document.getElementById('ao-brand').value = 'Other';
          document.getElementById('ao-brand-other').style.display = '';
          document.getElementById('ao-brand-other').value = lead.device_brand;
        }
        if (lead.device_model) {
          document.getElementById('ao-model-other').disabled = false;
          document.getElementById('ao-model-other').value = lead.device_model;
        }
        // Carry the lead's quoted services + prices into the order form.
        const leadEst = Array.isArray(lead.service_estimates) ? lead.service_estimates : [];
        if (leadEst.length) {
          const others = [];
          leadEst.forEach(e => {
            const row = Array.from(document.querySelectorAll('#ao-services .service-row'))
              .find(r => r.querySelector('input[type="checkbox"]').value === e.service);
            if (row) {
              row.querySelector('input[type="checkbox"]').checked = true;
              if (e.cost != null) row.querySelector('.service-cost').value = e.cost;
            } else {
              others.push(e);
            }
          });
          if (others.length) {
            document.getElementById('ao-service-other').value = others.map(e => e.service).join(', ');
            if (others.some(e => e.cost != null)) {
              document.getElementById('ao-service-other-cost').value = others.reduce((sum, e) => sum + (Number(e.cost) || 0), 0);
            }
          }
        } else if (lead.service) {
          document.getElementById('ao-service-other').value = lead.service;
        }
        if (lead.notes) document.getElementById('ao-issue').value = lead.notes;
        if (lead.assigned_to_id) {
          document.getElementById('ao-cc').value = lead.assigned_to_id;
        }
        showToast('Lead details loaded — finish the device & services, then create the order', 'info');
      }
    }

    recalcAddOrderCost();
    openModal('add-order-modal');
  }

    const time    = document.getElementById('ao-time').value.trim();
    const cost    = document.getElementById('ao-cost').value;
    const cc      = document.getElementById('ao-cc').value;
    const otherService = document.getElementById('ao-service-other').value.trim();

    const services = Array.from(document.querySelectorAll('#ao-services input[type="checkbox"]:checked')).map(cb => cb.value);
    if (otherService) services.push(otherService);

    if (!name)  { showToast('Customer name is required', 'warn'); return; }
    if (!phone) { showToast('Customer phone is required', 'warn'); return; }
    if (!brand) { showToast('Device brand is required', 'warn'); return; }
    if (!model) { showToast('Device model is required', 'warn'); return; }
    if (!services.length) { showToast('Select at least one service', 'warn'); return; }

    const payload = {
      customer_name: name, customer_phone: phone,
      customer_email: email || undefined, customer_address: address || undefined,
      device_brand: brand, device_model: model,
      services, issue_description: issue || undefined,
      service_type: serviceType, pickup_address: address || undefined,
      scheduled_date: date || undefined, scheduled_time: time || undefined,
      priority, estimated_cost: cost || undefined,
      service_estimates: getAddOrderServiceEstimates(),
      customer_care_id: cc || undefined,
    };

    const r = await apiCall('/orders/manual', { method: 'POST', body: JSON.stringify(payload) });
    if (!r || !r.ok) { showToast(r?.data?.message || 'Failed to create order', 'error'); return; }

    const newOrderId = r.data.data.order_id;
    showToast(`Order ${newOrderId} created`, 'success');

    // If this order came from a converted lead, close the loop: link the
    // reminder to the new order and mark it done so it drops off the queues.
    if (pendingLeadId) {
      await apiCall(`/activities/${pendingLeadId}`, {
        method: 'PATCH',
        body: JSON.stringify({ order_id: newOrderId, status: 'done', notes: `Converted to order ${newOrderId}` }),
      });
      pendingLeadId = null;
      window.history.replaceState({}, '', './orders.html');
    }

    closeModal('add-order-modal');
    loadOrders();
  }

  // The export endpoint needs the auth header, which window.open() can't send —
  // fetch it and hand the browser the file as a download instead.
  async function exportCSV() {
    const params = new URLSearchParams({
      ...(state.status    && { status: state.status }),
      ...(state.date_from && { date_from: state.date_from }),
      ...(state.date_to   && { date_to: state.date_to }),
    });
    let resp;
    try {
      resp = await fetch(`${CRM.API_BASE}/orders/export?${params}`, {
        headers: { Authorization: `Bearer ${localStorage.getItem('crm_token')}` },
      });
    } catch {
      showToast('Network error — export failed', 'error');
      return;
    }
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      showToast(err.message || 'Export failed', 'error');
      return;
    }
    const match = /filename="([^"]+)"/.exec(resp.headers.get('Content-Disposition') || '');
    const url = URL.createObjectURL(await resp.blob());
    const a = document.createElement('a');
    a.href = url;
    a.download = match ? match[1] : `TurboFix-Orders-${localISODate()}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  loadOrders();
</script>
</body>
