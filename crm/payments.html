      </div>

        <a href="#" class="nav-item" onclick="logout();return false;"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>Sign Out</a>

    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="sidebar-user-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Admin</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Admin</div>
        </div>
      </div>
    </div>

  <div class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menu-toggle"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg></button>
        <div><div class="header-title">Payments</div></div>
      </div>
    </header>

    <div class="page-content">
      <!-- Summary cards -->
      <div class="stats-grid" id="pay-stats" style="margin-bottom:24px;">
        <div class="stat-card green">
          <div class="stat-icon green"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 013 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 00-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 01-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 003 15h-.75M15 10.5a3 3 0 11-6 0 3 3 0 016 0zm3 0h.008v.008H18V10.5zm-12 0h.008v.008H6V10.5z"/></svg></div>
          <div class="stat-value" id="pay-total">—</div>
          <div class="stat-label">Total Collected</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-icon blue"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"/></svg></div>
          <div class="stat-value" id="pay-count">—</div>
          <div class="stat-label">Total Transactions</div>
        </div>
        <div class="stat-card amber" id="pay-cash-card">
          <div class="stat-icon amber"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z"/></svg></div>
          <div class="stat-value" id="pay-cash">—</div>
          <div class="stat-label">Cash Collected</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-icon blue"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3"/></svg></div>
          <div class="stat-value" id="pay-upi">—</div>
          <div class="stat-label">UPI Collected</div>
        </div>
      </div>

      <!-- Date filter -->
      <div class="toolbar" style="margin-bottom:16px;">
        <label class="form-label" style="margin:0;white-space:nowrap;">From</label>
        <input type="date" class="form-control" style="width:auto;" id="pay-from" onchange="loadSummary()" />
        <label class="form-label" style="margin:0;white-space:nowrap;">To</label>
        <input type="date" class="form-control" style="width:auto;" id="pay-to" onchange="loadSummary()" />
        <button class="btn btn-secondary btn-sm" onclick="clearDates()">Clear</button>
      </div>

      <!-- Table -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Customer</th>
              <th>Amount</th>
              <th>Method</th>
              <th>Status</th>
              <th>Transaction ID</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="payments-tbody">
            <tr><td colspan="7" style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="/crm/js/config.js"></script>
<script src="/crm/js/utils.js"></script>
<script src="/crm/js/auth.js"></script>
<script>
  initCRM();

  async function loadSummary() {
    const from = document.getElementById('pay-from').value;
    const to   = document.getElementById('pay-to').value;
    const params = new URLSearchParams({ ...(from && { date_from: from }), ...(to && { date_to: to }) });

    const r = await apiCall(`/payments/summary?${params}`);
    if (!r || !r.ok) return;
    const d = r.data.data;

    document.getElementById('pay-total').textContent = formatCurrency(d.total);
    document.getElementById('pay-count').textContent = d.count;

    const cash = d.by_method.find(m => m.method === 'cash');
    const upi  = d.by_method.find(m => m.method === 'upi');
    document.getElementById('pay-cash').textContent = formatCurrency(cash?.amount || 0);
    document.getElementById('pay-upi').textContent  = formatCurrency(upi?.amount || 0);

    loadPaymentsList(from, to);
  }

  async function loadPaymentsList(from, to) {
    const tbody = document.getElementById('payments-tbody');
    const params = new URLSearchParams({
      limit: 50,
      ...(from && { date_from: from }),
      ...(to   && { date_to:   to }),
    });
    const r = await apiCall(`/payments?${params}`);
    if (!r || !r.ok) { tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--danger);padding:30px;">Failed</td></tr>`; return; }

    const payments = r.data.data;
    if (!payments.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><p>No payments found</p></div></td></tr>`;
      return;
    }

    const methodColors = { cash:'var(--success)', upi:'var(--accent)', card:'#A78BFA', bank_transfer:'#F59E0B', other:'var(--text-muted)' };
    tbody.innerHTML = payments.map(p => `
      <tr>
        <td class="primary">
          <a href="/crm/orders.html?id=${esc(p.order_ref)}" style="color:var(--accent);">${esc(p.order_ref)}</a>
        </td>
        <td style="font-size:13px;">${esc(p.customer_name||'—')}</td>
        <td style="font-weight:700;color:var(--success);font-size:14px;">${formatCurrency(p.amount)}</td>
        <td>
          <span style="font-size:12px;font-weight:600;color:${methodColors[p.method]||'var(--text-muted)'};">
            ${CRM.PAYMENT_METHODS[p.method]||p.method}
          </span>
        </td>
        <td><span class="badge" style="background:rgba(16,185,129,.15);color:var(--success);">${p.status}</span></td>
        <td style="font-size:12px;color:var(--text-muted);">${p.transaction_id ? `<span onclick="copyText('${esc(p.transaction_id)}','Transaction ID')" style="cursor:pointer;" title="Click to copy">${esc(p.transaction_id)}</span>` : '—'}</td>
        <td style="font-size:12px;color:var(--text-muted);">${formatDateTime(p.paid_at||p.created_at)}</td>
      </tr>
    `).join('');
  }

  function clearDates() {
    document.getElementById('pay-from').value = '';
    document.getElementById('pay-to').value   = '';
    loadSummary();
  }

  loadSummary();
</script>
</body>
</html>
