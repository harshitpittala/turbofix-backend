<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TurboFix CRM" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>Schedules — TurboFix CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/crm.css" />
</head>
<body>
<div id="toast-container"></div>
<div class="crm-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">T</div>
      <div><div class="logo-text">TurboFix</div><div class="logo-sub">CRM Dashboard</div></div>
    </div>
    <nav class="sidebar-nav" aria-label="Main navigation"><!-- built by renderSidebarNav() in js/auth.js --></nav>
    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="sidebar-user-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Admin</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menu-toggle"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg></button>
        <div><div class="header-title">Schedules & Reminders</div><div class="header-subtitle">Callbacks, follow-ups and undecided leads</div></div>
      </div>
    </header>

    <div class="page-content">
      <div class="toolbar">
        <div class="search-box">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803a7.5 7.5 0 0010.607 10.607z"/></svg>
          <input type="text" placeholder="Name or phone…" aria-label="Search reminders" oninput="debounceSearch(this.value)" />
        </div>
        <select class="form-control" style="width:150px;" aria-label="When" onchange="applyFilter('view',this.value)">
          <option value="">All</option>
          <option value="today" selected>Today</option>
          <option value="upcoming">Upcoming</option>
          <option value="overdue">Overdue</option>
        </select>
        <select class="form-control" style="width:150px;" aria-label="Status" onchange="applyFilter('status',this.value)">
          <option value="pending" selected>Pending</option>
          <option value="done">Done</option>
          <option value="cancelled">Not Interested / Cancelled</option>
          <option value="">All Statuses</option>
        </select>
        <select class="form-control" style="width:200px;" aria-label="Type" onchange="applyFilter('type',this.value)">
          <option value="">All Types</option>
        </select>
        <div style="flex:1;"></div>
        <button class="btn btn-primary btn-sm" onclick="openActivityModal()">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          New Reminder
        </button>
      </div>

      <div class="table-wrapper">
        <table class="table-cards">
          <thead>
            <tr>
              <th>Contact</th>
              <th>Interested In</th>
              <th>Type</th>
              <th>When</th>
              <th>Status</th>
              <th>Assigned</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="activities-tbody">
            <tr><td colspan="7" style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div></td></tr>
          </tbody>
        </table>
      </div>
      <div id="activities-pagination" class="pagination" style="margin-top:16px;"></div>
    </div>
  </div>
</div>

<!-- Schedule Activity modal (create / edit) -->
<div class="modal-overlay" id="activity-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="activity-modal-title">New Reminder</div>
      <button class="modal-close" onclick="closeModal('activity-modal')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="act-id" />
      <input type="hidden" id="act-order-ref" />
      <div id="act-order-banner" style="display:none;background:rgba(0,170,255,.08);border:1px solid rgba(0,170,255,.25);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--accent);margin-bottom:14px;"></div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Customer Name</label>
          <input type="text" class="form-control" id="act-name" placeholder="Optional" />
        </div>
        <div class="form-group">
          <label class="form-label">Phone *</label>
          <input type="text" class="form-control" id="act-phone" placeholder="10-digit mobile number" oninput="onLeadPhoneInput()" />
          <div id="act-existing-customer" style="font-size:11px;color:var(--success);margin-top:4px;display:none;"></div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Brand</label>
          <select class="form-control" id="act-brand" onchange="onActBrandChange()">
            <option value="">Select brand… (optional)</option>
          </select>
          <input type="text" class="form-control" id="act-brand-other" placeholder="Enter brand name" style="margin-top:8px;display:none;" />
        </div>
        <div class="form-group">
          <label class="form-label">Model</label>
          <select class="form-control" id="act-model" style="display:none;"></select>
          <input type="text" class="form-control" id="act-model-other" placeholder="Optional" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Interested In & Estimated Price</label>
        <div id="act-services" style="display:flex;flex-direction:column;gap:4px;font-size:13px;"></div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:8px;">
          <input type="text" class="form-control" id="act-service-other" placeholder="Other service (optional)" style="flex:1;" oninput="recalcActServices()" />
          <input type="number" class="form-control" id="act-service-other-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcActServices()" />
        </div>
        <div id="act-services-total" style="display:none;margin-top:8px;font-size:13px;font-weight:600;color:var(--text);text-align:right;"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Type *</label>
          <select class="form-control" id="act-type"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Assign To</label>
          <select class="form-control" id="act-assigned"><option value="">Unassigned</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Schedule Date *</label>
          <input type="date" class="form-control" id="act-date" />
        </div>
        <div class="form-group">
          <label class="form-label">Time *</label>
          <input type="time" class="form-control" id="act-time" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea class="form-control" id="act-notes" rows="2" placeholder="What did the customer say?"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('activity-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitActivity()">Save</button>
    </div>
  </div>
</div>

<script src="./js/config.js"></script>
<script src="./js/brands.js"></script>
<script src="./js/utils.js"></script>
<script src="./js/auth.js"></script>
<script>
  let currentUser = initCRM();
  let staffList = [];
  let state = { view: 'today', status: 'pending', type: '', search: '', page: 1 };

  // Arriving from an order's "+ Schedule" button: prefill the reminder with
  // that order's customer/device so a follow-up can be logged without
  // retyping anything, while regular lead capture never needs an order at all.
  const urlParams = new URLSearchParams(window.location.search);
  const linkedOrderId = urlParams.get('order');
  if (linkedOrderId) setTimeout(() => openActivityModal(null, linkedOrderId), 300);
  let searchTimer;

  (function populateTypeSelects() {
    const typeOpts = Object.entries(CRM.ACTIVITY_TYPE_LABELS).map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
    document.getElementById('act-type').innerHTML = typeOpts;
    document.querySelector('select[onchange*="applyFilter(\'type\'"]').insertAdjacentHTML('beforeend', typeOpts);
  })();

  (function populateBrands() {
    const sel = document.getElementById('act-brand');
    Object.keys(BRAND_MODELS).forEach(b => sel.insertAdjacentHTML('beforeend', `<option value="${esc(b)}">${esc(b)}</option>`));
    sel.insertAdjacentHTML('beforeend', `<option value="Other">Other</option>`);
  })();

  function onActBrandChange() {
    const brand = document.getElementById('act-brand').value;
    const brandOther = document.getElementById('act-brand-other');
    const modelSel = document.getElementById('act-model');
    const modelOther = document.getElementById('act-model-other');
    const models = BRAND_MODELS[brand] || [];

    brandOther.style.display = brand === 'Other' ? '' : 'none';
    if (models.length) {
      modelSel.innerHTML = `<option value="">Select model… (optional)</option>` + models.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
      modelSel.style.display = '';
      modelOther.style.display = 'none';
    } else {
      modelSel.style.display = 'none';
      modelOther.style.display = '';
    }
  }

  // Same service list as the Add Order form, so a lead converts cleanly.
  const ACT_SERVICES = ['Screen Replacement', 'Battery Replacement', 'Camera Module', 'Water Damage',
    'Speaker / Mic', 'Charging Port', 'Back Panel', 'Software / Data'];

  (function renderActServices() {
    document.getElementById('act-services').innerHTML = ACT_SERVICES.map(svc => `
      <div class="service-row" style="display:flex;align-items:center;gap:10px;padding:4px 0;">
        <label style="display:flex;align-items:center;gap:6px;flex:1;"><input type="checkbox" value="${esc(svc)}" onchange="recalcActServices()" /> ${esc(svc)}</label>
        <input type="number" class="form-control service-cost" min="0" step="1" placeholder="₹" style="width:100px;display:none;" oninput="recalcActServices()" />
      </div>`).join('');
  })();

  // Shows a price box next to each ticked service (and next to "Other" once
  // typed), and totals the prices entered so far.
  function recalcActServices() {
    let total = 0;
    document.querySelectorAll('#act-services .service-row').forEach(row => {
      const cb = row.querySelector('input[type="checkbox"]');
      const costInput = row.querySelector('.service-cost');
      costInput.style.display = cb.checked ? '' : 'none';
      if (!cb.checked) costInput.value = '';
      else total += parseFloat(costInput.value) || 0;
    });
    const otherService = document.getElementById('act-service-other').value.trim();
    const otherCost = document.getElementById('act-service-other-cost');
    otherCost.style.display = otherService ? '' : 'none';
    if (!otherService) otherCost.value = '';
    else total += parseFloat(otherCost.value) || 0;

    const totalEl = document.getElementById('act-services-total');
    totalEl.style.display = total ? '' : 'none';
    totalEl.textContent = total ? `Estimated total: ${formatCurrency(total)}` : '';
  }

  // [{ service, cost }] for every ticked/typed service; cost is null when no price was entered.
  function getActServiceEstimates() {
    const toCost = v => { const n = parseFloat(v); return Number.isFinite(n) && n >= 0 ? n : null; };
    const estimates = [];
    document.querySelectorAll('#act-services .service-row').forEach(row => {
      const cb = row.querySelector('input[type="checkbox"]');
      if (cb.checked) estimates.push({ service: cb.value, cost: toCost(row.querySelector('.service-cost').value) });
    });
    const otherService = document.getElementById('act-service-other').value.trim();
    if (otherService) estimates.push({ service: otherService, cost: toCost(document.getElementById('act-service-other-cost').value) });
    return estimates;
  }

  // Fills the form from saved estimates. Anything not in the fixed list goes
  // into the "Other" box (several are joined with commas, prices summed).
  function setActServices(estimates) {
    document.querySelectorAll('#act-services .service-row').forEach(row => {
      const cb = row.querySelector('input[type="checkbox"]');
      const e = estimates.find(x => x.service === cb.value);
      cb.checked = !!e;
      row.querySelector('.service-cost').value = e && e.cost != null ? e.cost : '';
    });
    const others = estimates.filter(x => !ACT_SERVICES.includes(x.service));
    const otherCost = others.reduce((sum, x) => sum + (Number(x.cost) || 0), 0);
    document.getElementById('act-service-other').value = others.map(x => x.service).join(', ');
    document.getElementById('act-service-other-cost').value = others.some(x => x.cost != null) ? otherCost : '';
    recalcActServices();
  }

  function serviceSummaryHtml(a) {
    const est = Array.isArray(a.service_estimates) ? a.service_estimates : [];
    if (!est.length) return a.service ? `<div style="color:var(--text-muted);">${esc(a.service)}</div>` : '';
    const total = est.reduce((sum, e) => sum + (Number(e.cost) || 0), 0);
    return est.map(e => `<div style="color:var(--text-muted);">${esc(e.service)}${e.cost != null ? ` · ${formatCurrency(e.cost)}` : ''}</div>`).join('')
      + (est.length > 1 && total ? `<div style="font-weight:600;color:var(--text);">Total ${formatCurrency(total)}</div>` : '');
  }

  function getActBrand() {
    const sel = document.getElementById('act-brand').value;
    return sel === 'Other' ? document.getElementById('act-brand-other').value.trim() : sel;
  }
  function getActModel() {
    const modelSel = document.getElementById('act-model');
    if (modelSel.style.display !== 'none' && modelSel.value) return modelSel.value;
    return document.getElementById('act-model-other').value.trim();
  }

  // Nice-to-have: while capturing a lead, tell the telecaller if this phone
  // number already belongs to an existing customer (so they can greet them
  // by history instead of treating them as brand new).
  let phoneLookupTimer;
  function onLeadPhoneInput() {
    clearTimeout(phoneLookupTimer);
    const phone = document.getElementById('act-phone').value.trim();
    const hint = document.getElementById('act-existing-customer');
    hint.style.display = 'none';
    if (phone.length < 8) return;
    phoneLookupTimer = setTimeout(async () => {
      const r = await apiCall(`/customers/lookup?phone=${encodeURIComponent(phone)}`);
      if (r && r.ok && r.data.found) {
        const c = r.data.data;
        hint.textContent = `Existing customer: ${c.name} · ${c.total_orders} previous order(s)`;
        hint.style.display = '';
        if (!document.getElementById('act-name').value) document.getElementById('act-name').value = c.name;
      }
    }, 400);
  }

  async function loadStaff() {
    if (staffList.length) return;
    const r = await apiCall('/staff?active=true');
    if (r && r.ok) staffList = r.data.data || [];
    const sel = document.getElementById('act-assigned');
    sel.innerHTML = '<option value="">Unassigned</option>' +
      staffList.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  }

  function applyFilter(key, val) { state[key] = val; state.page = 1; loadActivities(); }
  function goToPage(p) { state.page = p; loadActivities(); }
  function debounceSearch(val) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => applyFilter('search', val), 350);
  }

  async function loadActivities() {
    const isStale = beginRequest('activities');
    const tbody = document.getElementById('activities-tbody');
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div></td></tr>`;

    const params = new URLSearchParams({
      page: state.page, limit: 20,
      ...(state.view   && { view: state.view }),
      ...(state.status && { status: state.status }),
      ...(state.type   && { type: state.type }),
      ...(state.search && { search: state.search }),
    });

    const r = await apiCall(`/activities?${params}`);
    if (isStale()) return;
    if (!r || !r.ok) {
      tbody.innerHTML = `<tr><td colspan="7">${loadErrorHTML(r, 'Failed to load reminders', 'loadActivities()')}</td></tr>`;
      document.getElementById('activities-pagination').innerHTML = '';
      return;
    }

    const { data, pagination } = r.data;
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><p>Nothing here</p></div></td></tr>`;
      document.getElementById('activities-pagination').innerHTML = '';
      return;
    }

    tbody.innerHTML = data.map(a => {
      const device = [a.device_brand, a.device_model].filter(Boolean).join(' ');
      const overdue = new Date(a.scheduled_at) < new Date() && a.status === 'pending';
      return `
      <tr>
        <td data-label="Contact">
          <div style="font-weight:600;font-size:13px;">${esc(a.customer_name||'Unnamed lead')}</div>
          <div style="font-size:11px;color:var(--text-muted);">${esc(a.customer_phone||'—')}</div>
          ${a.order_ref ? `<a href="./orders.html?id=${encodeURIComponent(a.order_ref)}" style="font-size:10px;color:var(--accent);">${esc(a.order_ref)}</a>` : ''}
        </td>
        <td data-label="Interested In" style="font-size:12px;color:var(--text-dim);">
          ${device ? `<div>${esc(device)}</div>` : ''}
          ${serviceSummaryHtml(a)}
          ${!device && !a.service ? '—' : ''}
        </td>
        <td data-label="Type" style="font-size:13px;">${CRM.ACTIVITY_TYPE_LABELS[a.type]||a.type}</td>
        <td data-label="When" style="font-size:12px;color:${overdue ? 'var(--danger)' : 'var(--text-dim)'};">${formatDateTime(a.scheduled_at)}</td>
        <td data-label="Status">${activityStatusBadge(a.status)}</td>
        <td data-label="Assigned" style="font-size:12px;">${esc(a.assigned_to_name||'Unassigned')}</td>
        <td class="td-actions">
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${a.customer_phone ? `<a href="tel:${esc(a.customer_phone)}" class="btn btn-secondary btn-sm" title="Call" aria-label="Call ${esc(a.customer_name || a.customer_phone)}">📞</a>` : ''}
            ${a.customer_phone ? `<a href="${waLink(a.customer_phone,'Hi, calling from TurboFix')}" target="_blank" class="btn btn-success btn-sm">WA</a>` : ''}
            ${a.status === 'pending' && !a.order_ref ? `<button class="btn btn-primary btn-sm" onclick="convertToOrder(${a.id})">Create Order</button>` : ''}
            ${a.status === 'pending' ? `<button class="btn btn-secondary btn-sm" onclick="markStatus(${a.id},'done')">Done</button>` : ''}
            ${a.status === 'pending' ? `<button class="btn btn-secondary btn-sm" onclick="markStatus(${a.id},'cancelled')">Not Interested</button>` : ''}
            <button class="btn btn-secondary btn-sm" onclick="openActivityModal(${a.id})">Edit</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    renderPagination('activities-pagination', pagination, 'goToPage');
  }

  async function markStatus(id, status) {
    const r = await apiCall(`/activities/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
    if (!r || !r.ok) { showToast(r?.data?.message || 'Failed to update', 'error'); return; }
    showToast(status === 'done' ? 'Marked done' : 'Marked not interested', 'success');
    loadActivities();
  }

  // Hands off to the Add Order flow on orders.html, pre-filled with what we
  // already captured for this lead — nothing needs retyping once they confirm.
  function convertToOrder(id) {
    window.location.href = `./orders.html?lead=${id}`;
  }

  async function openActivityModal(id, orderIdToLink) {
    await loadStaff();
    document.getElementById('activity-modal-title').textContent = id ? 'Edit Reminder' : 'New Reminder';
    document.getElementById('act-id').value = id || '';
    document.getElementById('act-order-ref').value = '';
    document.getElementById('act-order-banner').style.display = 'none';
    document.getElementById('act-name').value = '';
    document.getElementById('act-phone').value = '';
    document.getElementById('act-existing-customer').style.display = 'none';
    setActServices([]);
    document.getElementById('act-notes').value = '';
    document.getElementById('act-date').value = localISODate();
    document.getElementById('act-time').value = '10:00';
    document.getElementById('act-type').value = 'callback';
    document.getElementById('act-assigned').value = '';
    document.getElementById('act-brand').value = '';
    document.getElementById('act-brand-other').style.display = 'none';
    document.getElementById('act-brand-other').value = '';
    document.getElementById('act-model').style.display = 'none';
    document.getElementById('act-model').innerHTML = '';
    document.getElementById('act-model-other').style.display = '';
    document.getElementById('act-model-other').value = '';

    if (id) {
      const r = await apiCall(`/activities/${id}`);
      if (r && r.ok) {
        const a = r.data.data;
        document.getElementById('act-name').value = a.customer_name || '';
        document.getElementById('act-phone').value = a.customer_phone || '';
        // Older reminders only have the free-text `service`; show it as "Other".
        const est = Array.isArray(a.service_estimates) ? a.service_estimates : [];
        setActServices(est.length ? est : (a.service ? [{ service: a.service, cost: null }] : []));
        document.getElementById('act-type').value = a.type;
        document.getElementById('act-assigned').value = a.assigned_to_id || '';
        document.getElementById('act-notes').value = a.notes || '';
        if (a.device_brand) {
          document.getElementById('act-brand').value = 'Other';
          document.getElementById('act-brand-other').style.display = '';
          document.getElementById('act-brand-other').value = a.device_brand;
        }
        if (a.device_model) document.getElementById('act-model-other').value = a.device_model;
        if (a.order_ref) {
          document.getElementById('act-order-ref').value = a.order_ref;
          document.getElementById('act-order-banner').style.display = '';
          document.getElementById('act-order-banner').textContent = `Linked to order ${a.order_ref}`;
        }
        const dt = new Date(a.scheduled_at);
        document.getElementById('act-date').value = localISODate(dt);
        document.getElementById('act-time').value = dt.toTimeString().slice(0,5);
      }
    } else if (orderIdToLink) {
      const r = await apiCall(`/orders/${orderIdToLink}`);
      if (r && r.ok) {
        const o = r.data.data;
        document.getElementById('act-order-ref').value = o.order_id;
        document.getElementById('act-order-banner').style.display = '';
        document.getElementById('act-order-banner').textContent = `Linked to order ${o.order_id} — this follow-up will show on that order too`;
        document.getElementById('act-name').value = o.customer_name || '';
        document.getElementById('act-phone').value = o.customer_phone || '';
        if (o.device_brand) {
          document.getElementById('act-brand').value = 'Other';
          document.getElementById('act-brand-other').style.display = '';
          document.getElementById('act-brand-other').value = o.device_brand;
        }
        if (o.device_model) document.getElementById('act-model-other').value = o.device_model;
        document.getElementById('act-type').value = 'post_repair_follow_up';
      }
    }
    openModal('activity-modal');
  }

  async function submitActivity() {
    const id       = document.getElementById('act-id').value;
    const name     = document.getElementById('act-name').value.trim();
    const phone    = document.getElementById('act-phone').value.trim();
    const brand    = getActBrand();
    const model    = getActModel();
    const serviceEstimates = getActServiceEstimates();
    const type     = document.getElementById('act-type').value;
    const assigned = document.getElementById('act-assigned').value;
    const date     = document.getElementById('act-date').value;
    const time     = document.getElementById('act-time').value;
    const notes    = document.getElementById('act-notes').value.trim();

    const orderRef = document.getElementById('act-order-ref').value;
    if (!phone) { showToast('Phone number is required', 'warn'); return; }
    if (!date || !time) { showToast('Pick a date and time', 'warn'); return; }
    const scheduledAt = new Date(`${date}T${time}:00`).toISOString();

    const payload = {
      customer_name: name || undefined, phone, type,
      device_brand: brand || undefined, device_model: model || undefined,
      service_estimates: serviceEstimates,
      scheduled_at: scheduledAt, notes, assigned_to_id: assigned || null,
      order_id: orderRef || undefined,
    };

    const r = id
      ? await apiCall(`/activities/${id}`, { method: 'PATCH', body: JSON.stringify(payload) })
      : await apiCall('/activities', { method: 'POST', body: JSON.stringify(payload) });

    if (!r || !r.ok) { showToast(r?.data?.message || 'Failed to save', 'error'); return; }
    showToast(id ? 'Reminder updated' : 'Reminder scheduled', 'success');
    closeModal('activity-modal');
    if (linkedOrderId) window.history.replaceState({}, '', './schedules.html');
    loadActivities();
  }

  loadActivities();
</script>
</body>
</html>
