<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TurboFix CRM" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>Technicians — TurboFix CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/crm.css" />
  <style>
    .tech-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .tech-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 20px; }
    .color-swatch {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid var(--border); cursor: pointer;
    }
    .color-swatch.selected { transform: scale(1.25); border-color: #fff; }
    .color-swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  </style>
</head>
<body>
<div id="toast-container"></div>
<div class="crm-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">T</div>
      <div><div class="logo-text">TurboFix</div><div class="logo-sub">CRM Dashboard</div></div>
    </div>
    <nav class="sidebar-nav" aria-label="Main navigation"><!-- built by renderSidebarNav() in js/auth.js --></nav>
    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="sidebar-user-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Admin</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menu-toggle"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg></button>
        <div><div class="header-title">Technicians</div></div>
      </div>
      <div class="header-right">
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          Add Technician
        </button>
      </div>
    </header>

    <div class="page-content">
      <div class="tech-cards-grid" id="tech-grid">
        <div class="page-loader" style="grid-column:1/-1;"><div class="spinner"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Technician Modal -->
<div class="modal-overlay" id="tech-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="tech-modal-title">Add Technician</div>
      <button class="modal-close" onclick="closeModal('tech-modal')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="tech-edit-id" />
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" class="form-control" id="tech-name" placeholder="Vikram Rao" />
        </div>
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input type="email" class="form-control" id="tech-email" placeholder="tech@turbofix.in" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Phone *</label>
          <input type="text" class="form-control" id="tech-phone" placeholder="+91 98765 00000" />
        </div>
        <div class="form-group">
          <label class="form-label">Experience (years)</label>
          <input type="number" class="form-control" id="tech-exp" placeholder="5" min="0" max="50" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Specialty</label>
        <input type="text" class="form-control" id="tech-specialty" placeholder="iPhone & Samsung Expert" />
      </div>
      <div class="form-group" id="tech-password-group">
        <label class="form-label">Password * (min 8 chars)</label>
        <input type="password" class="form-control" id="tech-password" placeholder="••••••••" />
      </div>
      <div class="form-group">
        <label class="form-label">Avatar Color</label>
        <div class="color-swatches" id="color-swatches">
          <div class="color-swatch selected" style="background:#00AAFF;" data-color="#00AAFF" onclick="selectColor(this)" role="button" aria-label="Blue"></div>
          <div class="color-swatch" style="background:#0066FF;" data-color="#0066FF" onclick="selectColor(this)"></div>
          <div class="color-swatch" style="background:#10B981;" data-color="#10B981" onclick="selectColor(this)"></div>
          <div class="color-swatch" style="background:#F59E0B;" data-color="#F59E0B" onclick="selectColor(this)"></div>
          <div class="color-swatch" style="background:#EF4444;" data-color="#EF4444" onclick="selectColor(this)"></div>
          <div class="color-swatch" style="background:#8B5CF6;" data-color="#8B5CF6" onclick="selectColor(this)"></div>
          <div class="color-swatch" style="background:#EC4899;" data-color="#EC4899" onclick="selectColor(this)"></div>
          <div class="color-swatch" style="background:#F97316;" data-color="#F97316" onclick="selectColor(this)"></div>
        </div>
        <input type="hidden" id="tech-color" value="#00AAFF" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('tech-modal')">Cancel</button>
      <button class="btn btn-primary" id="tech-save-btn" onclick="saveTechnician()">Add Technician</button>
    </div>
  </div>
</div>

<script src="./js/config.js"></script>
<script src="./js/utils.js"></script>
<script src="./js/auth.js"></script>
<script>
  initCRM();
  let editingId = null;
  let techsById = {};

  async function loadTechnicians() {
    const grid = document.getElementById('tech-grid');
    const r = await apiCall('/technicians');
    if (!r || !r.ok) { grid.innerHTML = `<div style="grid-column:1/-1;">${loadErrorHTML(r, 'Failed to load technicians', 'loadTechnicians()')}</div>`; return; }
    const techs = r.data.data;
    techsById = Object.fromEntries(techs.map(t => [t.id, t]));
    if (!techs.length) { grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><p>No technicians yet. Add one!</p></div>'; return; }

    grid.innerHTML = techs.map(t => `
      <div class="tech-card">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
          ${techAvatar(t.name, t.avatar_color, 48)}
          <div style="flex:1;min-width:0;">
            <div style="font-size:15px;font-weight:700;color:var(--text);">${esc(t.name)}</div>
            <div style="font-size:12px;color:var(--text-muted);">${esc(t.specialty||'General Technician')}</div>
          </div>
          <span class="badge" style="${t.is_active ? 'background:rgba(16,185,129,.15);color:var(--success);' : 'background:rgba(239,68,68,.15);color:var(--danger);'}">${t.is_active ? 'Active' : 'Inactive'}</span>
        </div>
        <div class="info-grid" style="grid-template-columns:1fr 1fr;">
          <div class="info-item"><div class="info-label">Phone</div><div class="info-value" style="font-size:12px;">${esc(t.phone)}</div></div>
          <div class="info-item"><div class="info-label">Experience</div><div class="info-value" style="font-size:12px;">${t.experience_yrs} yrs</div></div>
          <div class="info-item"><div class="info-label">Total Orders</div><div class="info-value" style="font-size:12px;">${t.total_orders}</div></div>
          <div class="info-item"><div class="info-label">Active</div><div class="info-value" style="font-size:12px;">${t.active_orders}</div></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button class="btn btn-secondary btn-sm" onclick="editTech(techsById[${Number(t.id)}])">Edit</button>
          <button class="btn btn-sm ${t.is_active ? 'btn-danger':'btn-success'}" onclick="toggleTech(${t.id})">
            ${t.is_active ? 'Deactivate' : 'Activate'}
          </button>
        </div>
      </div>
    `).join('');
  }

  function selectColor(el) {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('tech-color').value = el.dataset.color;
  }

  function openAddModal() {
    editingId = null;
    document.getElementById('tech-modal-title').textContent = 'Add Technician';
    document.getElementById('tech-save-btn').textContent    = 'Add Technician';
    document.getElementById('tech-password-group').style.display = '';
    ['tech-name','tech-email','tech-phone','tech-exp','tech-specialty','tech-password'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('tech-color').value = '#00AAFF';
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.toggle('selected', s.dataset.color === '#00AAFF'));
    openModal('tech-modal');
  }

  function editTech(t) {
    editingId = t.id;
    document.getElementById('tech-modal-title').textContent = 'Edit Technician';
    document.getElementById('tech-save-btn').textContent    = 'Save Changes';
    document.getElementById('tech-password-group').style.display = 'none';
    document.getElementById('tech-name').value      = t.name;
    document.getElementById('tech-email').value     = t.email;
    document.getElementById('tech-phone').value     = t.phone;
    document.getElementById('tech-exp').value       = t.experience_yrs;
    document.getElementById('tech-specialty').value = t.specialty || '';
    document.getElementById('tech-color').value     = t.avatar_color || '#00AAFF';
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.toggle('selected', s.dataset.color === t.avatar_color));
    openModal('tech-modal');
  }

  async function saveTechnician() {
    const name      = document.getElementById('tech-name').value.trim();
    const email     = document.getElementById('tech-email').value.trim();
    const phone     = document.getElementById('tech-phone').value.trim();
    const exp       = document.getElementById('tech-exp').value;
    const specialty = document.getElementById('tech-specialty').value.trim();
    const password  = document.getElementById('tech-password').value;
    const color     = document.getElementById('tech-color').value;

    if (!name || !email || !phone) { showToast('Name, email and phone required', 'warn'); return; }
    if (!editingId && password.length < 8) { showToast('Password must be at least 8 characters', 'warn'); return; }

    const payload = { name, email, phone, specialty, experience_yrs: parseInt(exp)||0, avatar_color: color };
    if (!editingId) payload.password = password;

    const endpoint = editingId ? `/technicians/${editingId}` : '/technicians';
    const method   = editingId ? 'PUT' : 'POST';

    const r = await apiCall(endpoint, { method, body: JSON.stringify(payload) });
    if (!r || !r.ok) { showToast(r?.data?.message || 'Save failed', 'error'); return; }

    showToast(editingId ? 'Technician updated' : 'Technician added', 'success');
    closeModal('tech-modal');
    loadTechnicians();
  }

  async function toggleTech(id) {
    const r = await apiCall(`/technicians/${id}/toggle`, { method: 'PATCH' });
    if (!r || !r.ok) { showToast('Failed to update status', 'error'); return; }
    showToast(r.data.is_active ? 'Technician activated' : 'Technician deactivated', 'success');
    loadTechnicians();
  }

  loadTechnicians();
</script>
</body>
</html>
