<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — TurboFix CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/crm.css" />
  <style>
    .queue-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .queue-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
<div id="toast-container"></div>

<div class="crm-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">T</div>
      <div><div class="logo-text">TurboFix</div><div class="logo-sub">Telecaller Desk</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-label">Main</div>
        <a href="./telecaller-dashboard.html" class="nav-item active">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
          Dashboard
        </a>
        <a href="./orders.html" class="nav-item">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/></svg>
          Orders
        </a>
        <a href="./customers.html" class="nav-item">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Customers
        </a>
        <a href="./schedules.html" class="nav-item">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"/></svg>
          Schedules
        </a>
      </div>
      <div class="nav-section">
        <a href="#" class="nav-item" onclick="logout();return false;"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>Sign Out</a>
      </div>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="sidebar-user-avatar">T</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Telecaller</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Telecaller</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menu-toggle"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg></button>
        <div>
          <div class="header-title">Telecaller Dashboard</div>
          <div class="header-subtitle" id="header-date">—</div>
        </div>
      </div>
      <div class="header-right">
        <button class="btn btn-secondary btn-sm" onclick="window.location='./schedules.html'">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          New Lead / Reminder
        </button>
        <button class="btn btn-primary btn-sm" onclick="window.location='./orders.html'">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          New Order
        </button>
      </div>
    </header>

    <div class="page-content">
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card blue">
          <div class="stat-value" id="stat-new-orders">—</div>
          <div class="stat-label">New Orders Today</div>
        </div>
        <div class="stat-card amber">
          <div class="stat-value" id="stat-pending-calls">—</div>
          <div class="stat-label">Pending Calls</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-value" id="stat-repairs-today">—</div>
          <div class="stat-label">Today's Scheduled Repairs</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-value" id="stat-followups-today">—</div>
          <div class="stat-label">Today's Follow-ups</div>
        </div>
        <div class="stat-card amber">
          <div class="stat-value" id="stat-overdue">—</div>
          <div class="stat-label">Overdue Items</div>
        </div>
        <div class="stat-card amber">
          <div class="stat-value" id="stat-needs-attention">—</div>
          <div class="stat-label">Needs Attention</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;" class="queues-grid">
        <div class="card">
          <div class="card-header"><div class="card-title">Today's Queue</div></div>
          <div id="queue-today"><div class="page-loader"><div class="spinner"></div></div></div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title">Overdue</div></div>
          <div id="queue-overdue"><div class="page-loader"><div class="spinner"></div></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="./js/config.js"></script>
<script src="./js/utils.js"></script>
<script src="./js/auth.js"></script>
<script>
  initCRM();

  document.getElementById('header-date').textContent =
    new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  async function loadDashboard() {
    await Promise.all([loadStats(), loadQueue('today', 'queue-today'), loadQueue('overdue', 'queue-overdue')]);
  }

  async function loadStats() {
    const r = await apiCall('/dashboard/telecaller-stats');
    if (!r || !r.ok) return;
    const d = r.data.data;
    document.getElementById('stat-new-orders').textContent      = d.new_orders_today;
    document.getElementById('stat-pending-calls').textContent   = d.pending_calls;
    document.getElementById('stat-repairs-today').textContent   = d.todays_repairs;
    document.getElementById('stat-followups-today').textContent = d.todays_followups;
    document.getElementById('stat-overdue').textContent         = d.overdue_activities;
    document.getElementById('stat-needs-attention').textContent = d.needs_attention;
  }

  async function loadQueue(view, elId) {
    const r = await apiCall(`/activities?view=${view}&limit=15`);
    const el = document.getElementById(elId);
    if (!r || !r.ok) { el.innerHTML = '<p class="text-muted" style="font-size:13px;">Failed to load</p>'; return; }
    const items = r.data.data;
    if (!items.length) { el.innerHTML = '<div class="empty-state" style="padding:24px;"><p>Nothing here</p></div>'; return; }

    el.innerHTML = items.map(a => `
      <div class="queue-item">
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:600;color:var(--text);">${esc(a.customer_name || 'Unnamed lead')} · ${CRM.ACTIVITY_TYPE_LABELS[a.type] || a.type}</div>
          <div style="font-size:11px;color:var(--text-muted);">${esc(a.order_ref || a.customer_phone || '')} · ${formatDateTime(a.scheduled_at)}</div>
        </div>
        ${a.customer_phone ? `<a href="tel:${esc(a.customer_phone)}" class="btn btn-secondary btn-sm" title="Call">📞</a>` : ''}
        ${a.customer_phone ? `<a href="${waLink(a.customer_phone, 'Hi, calling from TurboFix' + (a.order_ref ? ' regarding order ' + a.order_ref : ''))}" target="_blank" class="btn btn-success btn-sm">WA</a>` : ''}
        <a href="${a.order_ref ? './orders.html?id=' + encodeURIComponent(a.order_ref) : './schedules.html'}" class="btn btn-secondary btn-sm">Open</a>
      </div>
    `).join('');
  }

  loadDashboard();
</script>
</body>
</html>
